<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 410" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="t">Qué ocurre al ejecutar new Perro</title>
  <desc id="d">Tres pasos al ejecutar new Perro con Scooby, macho y gigante. Primero empieza el constructor de Perro, y todavía no existe this, así que usarlo lanza un ReferenceError. Segundo, se ejecuta super(nombre, genero), que corre el constructor de Animal y asigna nombre y genero, y desde ahí ya existe this. Tercero, continúa el constructor de Perro y asigna tamano. El objeto resultante tiene nombre y genero, que vienen de Animal, y tamano, que es propio de Perro. Si el constructor de la clase hija no llama a super, new lanza un ReferenceError.</desc>
  <rect width="860" height="410" fill="#fffdf7"/>
  <text x="430" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#4d290b">new Perro("Scooby", "macho", "gigante"), paso a paso</text>
  <!-- Paso 1 -->
  <rect x="20" y="52" width="240" height="176" rx="12" fill="#fef9c3" stroke="#a16207" stroke-width="2"/>
  <text x="36" y="80" font-size="15" font-weight="800" fill="#713f12">1 · Empieza Perro</text>
  <g font-size="13" fill="#713f12">
    <text x="36" y="108">Todavía no existe this.</text>
    <text x="36" y="128">Solo puedes usar los</text>
    <text x="36" y="148">parámetros recibidos.</text>
  </g>
  <rect x="34" y="170" width="212" height="40" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <g font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="800" fill="#7f1d1d" text-anchor="middle">
    <text x="140" y="187">this.tamano = ...</text>
    <text x="140" y="203">→ ReferenceError</text>
  </g>
  <!-- Paso 2 -->
  <rect x="310" y="52" width="240" height="176" rx="12" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
  <text x="326" y="80" font-size="15" font-weight="800" fill="#312e81">2 · super(nombre, genero)</text>
  <g font-size="13" fill="#312e81">
    <text x="326" y="108">Se ejecuta el constructor</text>
    <text x="326" y="128">de Animal, que asigna</text>
    <text x="326" y="148">nombre y genero.</text>
    <text x="326" y="176" font-weight="800">Desde aquí ya existe this.</text>
  </g>
  <!-- Paso 3 -->
  <rect x="600" y="52" width="240" height="176" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="616" y="80" font-size="15" font-weight="800" fill="#14532d">3 · Sigue Perro</text>
  <g font-size="13" fill="#14532d">
    <text x="616" y="108">Ya se puede usar this:</text>
  </g>
  <rect x="614" y="120" width="212" height="30" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <text x="624" y="140" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="800" fill="#14532d">this.tamano = tamano;</text>
  <g font-size="13" fill="#14532d">
    <text x="616" y="176">El objeto queda completo</text>
    <text x="616" y="196">y new lo devuelve.</text>
  </g>
  <!-- Flechas -->
  <g stroke="#783d06" stroke-width="2.5" fill="#783d06">
    <line x1="262" y1="140" x2="300" y2="140"/><polygon points="298,134 308,140 298,146"/>
    <line x1="552" y1="140" x2="590" y2="140"/><polygon points="588,134 598,140 588,146"/>
  </g>
  <!-- Resultado -->
  <rect x="20" y="246" width="820" height="84" rx="12" fill="#ffffff" stroke="#e8c98a" stroke-width="1.5"/>
  <text x="36" y="270" font-size="13" font-weight="800" fill="#4d290b">Objeto resultante: scooby</text>
  <g text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="800">
    <rect x="36" y="282" width="190" height="32" rx="16" fill="#c7d2fe" stroke="#4338ca" stroke-width="1.5"/><text x="131" y="303" fill="#312e81">nombre: "Scooby"</text>
    <rect x="240" y="282" width="190" height="32" rx="16" fill="#c7d2fe" stroke="#4338ca" stroke-width="1.5"/><text x="335" y="303" fill="#312e81">genero: "macho"</text>
    <rect x="444" y="282" width="210" height="32" rx="16" fill="#bbf7d0" stroke="#15803d" stroke-width="1.5"/><text x="549" y="303" fill="#14532d">tamano: "gigante"</text>
  </g>
  <g font-size="12" fill="#4d290b">
    <text x="670" y="298">Azul: lo asigna Animal.</text>
    <text x="670" y="314">Verde: lo asigna Perro.</text>
  </g>
  <!-- Aviso -->
  <rect x="20" y="346" width="820" height="46" rx="12" fill="#ffedc9" stroke="#b45f06" stroke-width="2"/>
  <text x="430" y="374" text-anchor="middle" font-size="13" font-weight="800" fill="#4d290b">Si el constructor de la clase hija no llama a super(), new lanza un ReferenceError.</text>
</svg>
