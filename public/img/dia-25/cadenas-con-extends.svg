<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="t">Las dos cadenas que enlaza extends</title>
  <desc id="d">La palabra extends enlaza dos cadenas. La cadena de las instancias va de scooby a Perro.prototype, a Animal.prototype, a Object.prototype y a null, y sirve para los métodos de instancia. La cadena de los constructores va de Perro a Animal, a Function.prototype, a Object.prototype y a null, y sirve para los miembros estáticos. Object.getPrototypeOf(Perro.prototype) es igual a Animal.prototype, y Object.getPrototypeOf(Perro) es igual a Animal.</desc>
  <rect width="860" height="360" fill="#fffdf7"/>
  <text x="430" y="28" text-anchor="middle" font-size="20" font-weight="700" fill="#4d290b">extends enlaza dos cadenas a la vez</text>
  <text x="20" y="58" font-size="13" font-weight="800" fill="#4d290b">Cadena de las instancias (para los métodos de instancia)</text>
  <g text-anchor="middle" font-size="13" font-weight="800">
    <rect x="20" y="68" width="140" height="64" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="90" y="106" fill="#14532d">scooby</text>
    <rect x="190" y="68" width="140" height="64" rx="10" fill="#fef9c3" stroke="#a16207" stroke-width="2"/><text x="260" y="106" fill="#713f12" font-size="12">Perro.prototype</text>
    <rect x="360" y="68" width="140" height="64" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/><text x="430" y="106" fill="#312e81" font-size="12">Animal.prototype</text>
    <rect x="530" y="68" width="140" height="64" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="600" y="106" fill="#7c2d12" font-size="12">Object.prototype</text>
    <rect x="700" y="68" width="140" height="64" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 4"/><text x="770" y="106" fill="#6b7280" font-family="ui-monospace, Menlo, monospace">null</text>
  </g>
  <text x="20" y="168" font-size="13" font-weight="800" fill="#4d290b">Cadena de los constructores (para los miembros estáticos)</text>
  <g text-anchor="middle" font-size="13" font-weight="800">
    <rect x="20" y="178" width="140" height="64" rx="10" fill="#fef9c3" stroke="#a16207" stroke-width="2"/><text x="90" y="216" fill="#713f12">Perro</text>
    <rect x="190" y="178" width="140" height="64" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/><text x="260" y="216" fill="#312e81">Animal</text>
    <rect x="360" y="178" width="140" height="64" rx="10" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/><text x="430" y="216" fill="#374151" font-size="12">Function.prototype</text>
    <rect x="530" y="178" width="140" height="64" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="600" y="216" fill="#7c2d12" font-size="12">Object.prototype</text>
    <rect x="700" y="178" width="140" height="64" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 4"/><text x="770" y="216" fill="#6b7280" font-family="ui-monospace, Menlo, monospace">null</text>
  </g>
  <g stroke="#783d06" stroke-width="2.5" fill="#783d06">
    <line x1="160" y1="100" x2="180" y2="100"/><polygon points="178,94 188,100 178,106"/>
    <line x1="330" y1="100" x2="350" y2="100"/><polygon points="348,94 358,100 348,106"/>
    <line x1="500" y1="100" x2="520" y2="100"/><polygon points="518,94 528,100 518,106"/>
    <line x1="670" y1="100" x2="690" y2="100"/><polygon points="688,94 698,100 688,106"/>
    <line x1="160" y1="210" x2="180" y2="210"/><polygon points="178,204 188,210 178,216"/>
    <line x1="330" y1="210" x2="350" y2="210"/><polygon points="348,204 358,210 348,216"/>
    <line x1="500" y1="210" x2="520" y2="210"/><polygon points="518,204 528,210 518,216"/>
    <line x1="670" y1="210" x2="690" y2="210"/><polygon points="688,204 698,210 688,216"/>
  </g>
  <rect x="20" y="264" width="820" height="76" rx="12" fill="#ffedc9" stroke="#b45f06" stroke-width="2"/>
  <g font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="800" fill="#4d290b">
    <text x="36" y="292">Object.getPrototypeOf(Perro.prototype) === Animal.prototype  // true</text>
    <text x="36" y="316">Object.getPrototypeOf(Perro) === Animal  // true</text>
  </g>
</svg>
