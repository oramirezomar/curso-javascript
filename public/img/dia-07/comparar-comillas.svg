<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="t">Comillas dobles, comillas simples y acento grave</title>
  <desc id="d">Tabla comparativa de las tres formas de escribir una cadena. Las comillas dobles y simples no permiten interpolar ni escribir en varias líneas. El acento grave sí permite interpolar expresiones y escribir en varias líneas, y también admite etiquetas de plantilla.</desc>
  <rect width="860" height="330" fill="#fffdf7"/>
  <text x="430" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#4d290b">Tres formas de escribir una cadena</text>

  <!-- Cabeceras -->
  <g font-size="22" font-weight="800" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">
    <rect x="270" y="52" width="170" height="56" rx="12" fill="#ffedc9" stroke="#b45f06" stroke-width="2"/>
    <text x="355" y="90" fill="#4d290b">" "</text>
    <rect x="450" y="52" width="170" height="56" rx="12" fill="#ffedc9" stroke="#b45f06" stroke-width="2"/>
    <text x="535" y="90" fill="#4d290b">' '</text>
    <rect x="630" y="52" width="200" height="56" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="3"/>
    <text x="730" y="90" fill="#14532d">` `</text>
  </g>
  <g font-size="11" text-anchor="middle" fill="#783d06">
    <text x="355" y="124">comillas dobles</text>
    <text x="535" y="124">comillas simples</text>
    <text x="730" y="124" fill="#166534" font-weight="700">acento grave (plantilla)</text>
  </g>

  <!-- Filas -->
  <g font-size="14" font-weight="700" fill="#4d290b">
    <text x="30" y="166">Insertar valores con ${ }</text>
    <text x="30" y="212">Varias líneas sin escapes</text>
    <text x="30" y="258">Escapar la propia comilla</text>
    <text x="30" y="304">Etiquetas de plantilla</text>
  </g>
  <line x1="20" y1="140" x2="840" y2="140" stroke="#e2c28a"/>
  <g stroke="#e2c28a"><line x1="20" y1="184" x2="840" y2="184"/><line x1="20" y1="230" x2="840" y2="230"/><line x1="20" y1="276" x2="840" y2="276"/></g>

  <g font-size="22" font-weight="800" text-anchor="middle">
    <text x="355" y="168" fill="#b91c1c">✗</text><text x="535" y="168" fill="#b91c1c">✗</text><text x="730" y="168" fill="#15803d">✓</text>
    <text x="355" y="214" fill="#b91c1c">✗</text><text x="535" y="214" fill="#b91c1c">✗</text><text x="730" y="214" fill="#15803d">✓</text>
    <text x="355" y="304" fill="#b91c1c">✗</text><text x="535" y="304" fill="#b91c1c">✗</text><text x="730" y="304" fill="#15803d">✓</text>
  </g>
  <g font-size="12" text-anchor="middle" fill="#5f3109">
    <text x="355" y="256">si el texto lleva «"»</text>
    <text x="535" y="256">si el texto lleva «'»</text>
    <text x="730" y="256">solo si lleva «`»</text>
  </g>
</svg>
