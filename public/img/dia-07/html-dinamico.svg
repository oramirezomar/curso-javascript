<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 390" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="t">Generar HTML con concatenación y con una plantilla</title>
  <desc id="d">Con concatenación con más igual el HTML queda en una sola línea y el código se llena de comillas y signos de suma. Con una plantilla de texto el código se escribe en varias líneas con su sangría, tal como se vería el HTML, y se conservan los saltos de línea y la sangría en el resultado.</desc>
  <rect width="860" height="390" fill="#fffdf7"/>
  <text x="430" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#4d290b">Escribir HTML dentro de JavaScript</text>

  <!-- Concatenación -->
  <rect x="20" y="52" width="410" height="318" rx="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="225" y="80" text-anchor="middle" font-size="16" font-weight="800" fill="#7f1d1d">Concatenación  (+=)</text>
  <rect x="40" y="94" width="370" height="124" rx="8" fill="#0d1117"/>
  <g font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#c9d1d9">
    <text x="52" y="116">let lista = "&lt;ul&gt;";</text>
    <text x="52" y="136">lista += "&lt;li&gt;Primavera&lt;/li&gt;";</text>
    <text x="52" y="156">lista += "&lt;li&gt;Verano&lt;/li&gt;";</text>
    <text x="52" y="176">lista += "&lt;/ul&gt;";</text>
  </g>
  <text x="52" y="204" font-size="11" fill="#8b949e" font-family="ui-monospace, Menlo, monospace">// una línea de código por cada trozo</text>
  <text x="40" y="246" font-size="12" font-weight="700" fill="#7f1d1d">Resultado (todo de corrido):</text>
  <rect x="40" y="256" width="370" height="40" rx="8" fill="#fff" stroke="#b91c1c"/>
  <text x="52" y="281" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#7f1d1d">&lt;ul&gt;&lt;li&gt;Primavera&lt;/li&gt;&lt;li&gt;Verano&lt;/li&gt;&lt;/ul&gt;</text>
  <text x="225" y="326" text-anchor="middle" font-size="12" fill="#991b1b">La sangría y los saltos del código</text>
  <text x="225" y="344" text-anchor="middle" font-size="12" fill="#991b1b">no se reflejan en el resultado.</text>

  <!-- Plantilla -->
  <rect x="450" y="52" width="390" height="318" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="645" y="80" text-anchor="middle" font-size="16" font-weight="800" fill="#14532d">Plantilla de texto</text>
  <rect x="470" y="94" width="350" height="124" rx="8" fill="#0d1117"/>
  <g font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#c9d1d9">
    <text x="482" y="116">const lista = `&lt;ul&gt;</text>
    <text x="482" y="136">&#160;&#160;&lt;li&gt;Primavera&lt;/li&gt;</text>
    <text x="482" y="156">&#160;&#160;&lt;li&gt;Verano&lt;/li&gt;</text>
    <text x="482" y="176">&lt;/ul&gt;`;</text>
  </g>
  <text x="482" y="204" font-size="11" fill="#8b949e" font-family="ui-monospace, Menlo, monospace">// el código se ve como el HTML</text>
  <text x="470" y="246" font-size="12" font-weight="700" fill="#14532d">Resultado (conserva saltos y sangría):</text>
  <rect x="470" y="256" width="350" height="84" rx="8" fill="#fff" stroke="#15803d"/>
  <g font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#14532d">
    <text x="482" y="276">&lt;ul&gt;</text>
    <text x="482" y="292">&#160;&#160;&lt;li&gt;Primavera&lt;/li&gt;</text>
    <text x="482" y="308">&#160;&#160;&lt;li&gt;Verano&lt;/li&gt;</text>
    <text x="482" y="324">&lt;/ul&gt;</text>
  </g>
  <text x="645" y="360" text-anchor="middle" font-size="12" fill="#166534">Con comillas normales esto sería un error de sintaxis.</text>
</svg>
