<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="t">try...catch y el código asíncrono</title>
  <desc id="d">A la izquierda, código síncrono: el error se lanza mientras el try se está ejecutando, y el catch lo captura. A la derecha, un temporizador con setTimeout: el try termina antes de que la función programada se ejecute; cuando esa función lanza el error, el try ya no está activo y nadie lo captura. La solución es poner el try y el catch dentro de la función programada.</desc>
  <rect width="860" height="430" fill="#fffdf7"/>
  <text x="430" y="28" text-anchor="middle" font-size="20" font-weight="700" fill="#4d290b">El try solo protege el código que se ejecuta mientras está activo</text>

  <rect x="20" y="42" width="400" height="296" rx="14" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <rect x="440" y="42" width="400" height="296" rx="14" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <g font-size="15" font-weight="800" text-anchor="middle">
    <text x="220" y="68" fill="#14532d">Código síncrono: se captura</text>
    <text x="640" y="68" fill="#7f1d1d">Código programado: no se captura</text>
  </g>

  <!-- Código izquierda -->
  <rect x="46" y="84" width="348" height="104" rx="10" fill="#2b1b0e"/>
  <g font-family="ui-monospace, Menlo, monospace" font-size="14" font-weight="700" fill="#fde7c2">
    <text x="62" y="110">try {</text>
    <text x="62" y="132">&#160;&#160;JSON.parse("{");</text>
    <text x="62" y="154">} catch (error) {</text>
    <text x="62" y="176">&#160;&#160;console.log("capturado");  }</text>
  </g>
  <!-- Código derecha -->
  <rect x="466" y="84" width="348" height="104" rx="10" fill="#2b1b0e"/>
  <g font-family="ui-monospace, Menlo, monospace" font-size="14" font-weight="700" fill="#fde7c2">
    <text x="482" y="110">try {</text>
    <text x="482" y="132">&#160;&#160;setTimeout(falla, 0);</text>
    <text x="482" y="154">} catch (error) {</text>
    <text x="482" y="176">&#160;&#160;/* nunca se ejecuta */  }</text>
  </g>

  <!-- Línea de tiempo izquierda -->
  <g stroke="#6b7280" stroke-width="2" fill="#6b7280">
    <line x1="60" y1="252" x2="380" y2="252"/><polygon points="378,246 390,252 378,258"/>
  </g>
  <rect x="60" y="226" width="190" height="26" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="155" y="244" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="700" fill="#1e3a8a">try activo</text>
  <circle cx="200" cy="252" r="9" fill="#b91c1c"/>
  <text x="200" y="256" text-anchor="middle" font-size="11" font-weight="800" fill="#ffffff">!</text>
  <text x="200" y="284" text-anchor="middle" font-size="12" font-weight="700" fill="#7f1d1d">el error ocurre aquí,</text>
  <text x="200" y="300" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">dentro del try: lo captura el catch</text>
  <text x="374" y="272" text-anchor="end" font-size="11" fill="#6b7280">tiempo</text>

  <!-- Línea de tiempo derecha -->
  <g stroke="#6b7280" stroke-width="2" fill="#6b7280">
    <line x1="480" y1="252" x2="800" y2="252"/><polygon points="798,246 810,252 798,258"/>
  </g>
  <rect x="480" y="226" width="120" height="26" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="540" y="244" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="700" fill="#1e3a8a">try activo</text>
  <text x="650" y="242" text-anchor="middle" font-size="11" fill="#6b7280">el try ya terminó</text>
  <circle cx="750" cy="252" r="9" fill="#b91c1c"/>
  <text x="750" y="256" text-anchor="middle" font-size="11" font-weight="800" fill="#ffffff">!</text>
  <text x="640" y="284" text-anchor="middle" font-size="12" font-weight="700" fill="#7f1d1d">la función programada falla más tarde,</text>
  <text x="640" y="300" text-anchor="middle" font-size="12" font-weight="700" fill="#7f1d1d">fuera del try: nadie lo captura</text>
  <text x="794" y="272" text-anchor="end" font-size="11" fill="#6b7280">tiempo</text>

  <!-- Solución -->
  <rect x="60" y="360" width="740" height="52" rx="12" fill="#ffedc9" stroke="#b45f06" stroke-width="2"/>
  <text x="430" y="383" text-anchor="middle" font-size="13" font-weight="800" fill="#4d290b">Solución</text>
  <text x="430" y="402" text-anchor="middle" font-size="13" fill="#4d290b">Poner el try y el catch dentro de la función programada (o, más adelante, usar async/await).</text>
</svg>
