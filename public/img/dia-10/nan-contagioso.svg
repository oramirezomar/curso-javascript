<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="t">NaN se propaga y no se compara con igualdad</title>
  <desc id="d">Una operación inválida como 3.7 por "texto" produce NaN, y cualquier operación posterior con NaN también da NaN. NaN no es igual ni a sí mismo, por eso NaN === NaN es false. Para detectarlo se usa Number.isNaN, que no convierte su argumento.</desc>
  <rect width="860" height="360" fill="#fffdf7"/>
  <text x="430" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#4d290b">NaN se propaga y no se detecta con ===</text>

  <g text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="15" font-weight="700">
    <rect x="30" y="56" width="220" height="64" rx="12" fill="#ffedc9" stroke="#b45f06" stroke-width="2"/>
    <text x="140" y="94" fill="#4d290b">3.7 * "texto"</text>
    <rect x="320" y="56" width="140" height="64" rx="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/>
    <text x="390" y="94" fill="#7f1d1d">NaN</text>
    <rect x="530" y="56" width="140" height="64" rx="12" fill="#ffedc9" stroke="#b45f06" stroke-width="2"/>
    <text x="600" y="94" fill="#4d290b">NaN + 1</text>
    <rect x="720" y="56" width="110" height="64" rx="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="3"/>
    <text x="775" y="94" fill="#7f1d1d">NaN</text>
  </g>
  <g stroke="#783d06" stroke-width="3" fill="#783d06">
    <line x1="252" y1="88" x2="304" y2="88"/><polygon points="302,81 316,88 302,95"/>
    <line x1="462" y1="88" x2="514" y2="88"/><polygon points="512,81 526,88 512,95"/>
    <line x1="672" y1="88" x2="704" y2="88"/><polygon points="702,81 716,88 702,95"/>
  </g>
  <text x="430" y="146" text-anchor="middle" font-size="13" fill="#5f3109">Una vez que aparece, contagia el resto del cálculo: basta comprobarlo una vez al final.</text>

  <rect x="30" y="170" width="390" height="160" rx="14" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="225" y="198" text-anchor="middle" font-size="14" font-weight="800" fill="#7f1d1d">No sirve</text>
  <g font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#7f1d1d">
    <text x="50" y="232">NaN === NaN   // false</text>
    <text x="50" y="256">NaN == NaN    // false</text>
    <text x="50" y="280">x === NaN     // siempre false</text>
  </g>
  <text x="50" y="312" font-size="12" fill="#7f1d1d">NaN no es igual a ningún valor, ni siquiera a sí mismo.</text>

  <rect x="440" y="170" width="390" height="160" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="3"/>
  <text x="635" y="198" text-anchor="middle" font-size="14" font-weight="800" fill="#14532d">Sí sirve</text>
  <g font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#14532d">
    <text x="460" y="226">Number.isNaN(x)</text>
    <text x="460" y="248">Object.is(x, NaN)</text>
    <text x="460" y="270">x !== x</text>
  </g>
  <text x="460" y="306" font-size="12" fill="#14532d">isNaN("hola") es true porque convierte antes;</text>
  <text x="460" y="322" font-size="12" fill="#14532d">Number.isNaN("hola") es false.</text>
</svg>
