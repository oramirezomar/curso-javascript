  <text x="398" y="95" text-anchor="middle" font-size="20" font-weight="800" fill="#1e3a8a" font-family="ui-monospace, Menlo, monospace">−1</text>
  <rect x="451" y="60" width="88" height="56" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="495" y="95" text-anchor="middle" font-size="20" font-weight="800" fill="#1e3a8a" font-family="ui-monospace, Menlo, monospace">0</text>
