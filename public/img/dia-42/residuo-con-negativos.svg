  <text x="85" y="164" text-anchor="middle" font-size="13" font-weight="800" fill="#334155" font-family="ui-monospace, Menlo, monospace">n % 2</text>
  <rect x="160" y="130" width="88" height="56" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2.5"/>
