<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="t">El residuo de un negativo es negativo</title>
  <desc id="d">Tabla del residuo de dividir entre 2 los números de menos 3 a 3. El residuo n % 2 vale menos 1, 0, menos 1, 0, 1, 0, 1. Comprobar si el residuo es igual a 1 solo detecta como impares el 1 y el 3, y falla con menos 3 y menos 1. Comprobar si el residuo es distinto de 0 detecta bien todos los impares. El operador porcentaje es un residuo, no un módulo: toma el signo del dividendo.</desc>
  <rect width="860" height="400" fill="#fffdf7"/>
  <text x="430" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#4d290b">n % 2 con números negativos</text>
  <rect x="20" y="60" width="130" height="56" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2.5"/>
  <text x="85" y="95" text-anchor="middle" font-size="16" font-weight="800" fill="#334155" font-family="ui-monospace, Menlo, monospace">n</text>
