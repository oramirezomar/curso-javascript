  <text x="430" y="346" text-anchor="middle" font-size="14" font-weight="800" fill="#4d290b">Con === 1, los impares −3 y −1 se pierden: su residuo es −1.</text>
  <text x="430" y="372" text-anchor="middle" font-size="13" font-weight="500" fill="#64748b">% es un residuo, no un módulo: toma el signo del dividendo.</text>
