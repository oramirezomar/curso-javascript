  <rect x="20" y="262" width="130" height="56" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2.5"/>
  <text x="85" y="296" text-anchor="middle" font-size="13" font-weight="800" fill="#334155" font-family="ui-monospace, Menlo, monospace">n % 2 !== 0</text>
  <rect x="160" y="262" width="88" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="204" y="296" text-anchor="middle" font-size="15" font-weight="800" fill="#14532d" font-family="ui-monospace, Menlo, monospace">true</text>
  <rect x="257" y="262" width="88" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
  <text x="301" y="296" text-anchor="middle" font-size="15" font-weight="800" fill="#14532d" font-family="ui-monospace, Menlo, monospace">false</text>
  <rect x="354" y="262" width="88" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
