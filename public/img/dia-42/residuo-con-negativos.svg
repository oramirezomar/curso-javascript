  <text x="689" y="230" text-anchor="middle" font-size="15" font-weight="800" fill="#14532d" font-family="ui-monospace, Menlo, monospace">false</text>
  <rect x="742" y="196" width="88" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
