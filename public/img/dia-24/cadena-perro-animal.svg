<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="t">La cadena de prototipos con herencia</title>
  <desc id="d">La instancia snoopy tiene como prototipo a Perro.prototype, que tiene como prototipo a Animal.prototype, que tiene como prototipo a Object.prototype, cuyo prototipo es null. snoopy.tamano se encuentra en snoopy, en un eslabón. snoopy.ladrar se encuentra en Perro.prototype, en dos eslabones. snoopy.saludar se encuentra en Animal.prototype, en tres eslabones. snoopy.toString se encuentra en Object.prototype, en cuatro eslabones.</desc>
  <rect width="860" height="440" fill="#fffdf7"/>
  <text x="430" y="28" text-anchor="middle" font-size="20" font-weight="700" fill="#4d290b">Con herencia, la cadena tiene un eslabón más</text>
  <!-- Eslabones -->
  <g text-anchor="middle">
    <rect x="20" y="56" width="150" height="120" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="95" y="80" font-size="14" font-weight="800" fill="#14532d">snoopy</text>
    <g font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="700" fill="#14532d">
      <text x="95" y="108">nombre</text><text x="95" y="128">genero</text><text x="95" y="148">tamano</text>
    </g>
    <rect x="200" y="56" width="175" height="120" rx="12" fill="#fef9c3" stroke="#a16207" stroke-width="2"/>
    <text x="287" y="80" font-size="14" font-weight="800" fill="#713f12">Perro.prototype</text>
    <g font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="700" fill="#713f12">
      <text x="287" y="108">constructor</text><text x="287" y="128">sonar</text><text x="287" y="148">ladrar</text>
    </g>
    <rect x="405" y="56" width="175" height="120" rx="12" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
    <text x="492" y="80" font-size="14" font-weight="800" fill="#312e81">Animal.prototype</text>
    <g font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="700" fill="#312e81">
      <text x="492" y="108">constructor</text><text x="492" y="128">sonar</text><text x="492" y="148">saludar</text>
    </g>
    <rect x="610" y="56" width="160" height="120" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
    <text x="690" y="80" font-size="14" font-weight="800" fill="#7c2d12">Object.prototype</text>
    <g font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="700" fill="#7c2d12">
      <text x="690" y="108">toString</text><text x="690" y="128">hasOwnProperty</text><text x="690" y="148">...</text>
    </g>
    <rect x="796" y="56" width="50" height="120" rx="12" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="821" y="122" font-family="ui-monospace, Menlo, monospace" font-size="14" font-weight="800" fill="#6b7280">null</text>
  </g>
  <!-- Flechas [[Prototype]] -->
  <g stroke="#783d06" stroke-width="2.5" fill="#783d06">
    <line x1="170" y1="116" x2="190" y2="116"/><polygon points="188,110 198,116 188,122"/>
    <line x1="375" y1="116" x2="395" y2="116"/><polygon points="393,110 403,116 393,122"/>
    <line x1="580" y1="116" x2="600" y2="116"/><polygon points="598,110 608,116 598,122"/>
    <line x1="770" y1="116" x2="788" y2="116"/><polygon points="786,110 796,116 786,122"/>
  </g>
  <text x="430" y="196" text-anchor="middle" font-size="12" font-weight="700" fill="#783d06">Cada flecha es el [[Prototype]] del eslabón anterior.</text>
  <!-- Tabla de búsquedas -->
  <g font-size="13" font-weight="800" text-anchor="middle" fill="#4d290b">
    <rect x="20" y="212" width="230" height="34" rx="8" fill="#ffedc9" stroke="#b45f06" stroke-width="2"/><text x="135" y="234">Búsqueda</text>
    <rect x="260" y="212" width="360" height="34" rx="8" fill="#ffedc9" stroke="#b45f06" stroke-width="2"/><text x="440" y="234">Dónde se encuentra</text>
    <rect x="630" y="212" width="210" height="34" rx="8" fill="#ffedc9" stroke="#b45f06" stroke-width="2"/><text x="735" y="234">Eslabones recorridos</text>
  </g>
  <g fill="#ffffff" stroke="#e8c98a" stroke-width="1.5">
    <rect x="20" y="252" width="230" height="38" rx="8"/><rect x="260" y="252" width="360" height="38" rx="8"/><rect x="630" y="252" width="210" height="38" rx="8"/>
    <rect x="20" y="296" width="230" height="38" rx="8"/><rect x="260" y="296" width="360" height="38" rx="8"/><rect x="630" y="296" width="210" height="38" rx="8"/>
    <rect x="20" y="340" width="230" height="38" rx="8"/><rect x="260" y="340" width="360" height="38" rx="8"/><rect x="630" y="340" width="210" height="38" rx="8"/>
    <rect x="20" y="384" width="230" height="38" rx="8"/><rect x="260" y="384" width="360" height="38" rx="8"/><rect x="630" y="384" width="210" height="38" rx="8"/>
  </g>
  <g font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="800" fill="#312e81" text-anchor="middle">
    <text x="135" y="276">snoopy.tamano</text>
    <text x="135" y="320">snoopy.ladrar()</text>
    <text x="135" y="364">snoopy.saludar()</text>
    <text x="135" y="408">snoopy.toString()</text>
  </g>
  <g font-size="13" fill="#3b2410" text-anchor="middle">
    <text x="440" y="276">En snoopy (propiedad propia)</text>
    <text x="440" y="320">En Perro.prototype</text>
    <text x="440" y="364">En Animal.prototype (heredado del padre)</text>
    <text x="440" y="408">En Object.prototype</text>
  </g>
  <g font-size="13" font-weight="800" text-anchor="middle">
    <text x="735" y="276" fill="#14532d">1</text>
    <text x="735" y="320" fill="#713f12">2</text>
    <text x="735" y="364" fill="#312e81">3</text>
    <text x="735" y="408" fill="#7c2d12">4</text>
  </g>
</svg>
