<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="t">Índices de un arreglo</title>
  <desc id="d">Un arreglo de cuatro colores: rojo, verde, azul y negro. Los índices empiezan en 0 y llegan a 3, que es la longitud menos uno. Con el método at se puede contar desde el final con índices negativos: menos 1 es el último elemento.</desc>
  <rect width="860" height="340" fill="#fffdf7"/>
  <text x="430" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#4d290b">Los índices empiezan en 0</text>
  <text x="430" y="58" text-anchor="middle" font-size="15" font-family="ui-monospace, Menlo, monospace" fill="#783d06">const colores = ["rojo", "verde", "azul", "negro"];</text>

  <!-- Índices positivos -->
  <g font-size="13" font-weight="800" text-anchor="middle" fill="#14532d">
    <text x="130" y="100">0</text><text x="300" y="100">1</text><text x="470" y="100">2</text><text x="640" y="100">3</text>
  </g>
  <text x="38" y="100" font-size="12" fill="#14532d" font-weight="700">índice</text>

  <!-- Elementos -->
  <g font-family="ui-monospace, Menlo, monospace" font-size="18" font-weight="800" text-anchor="middle">
    <rect x="55" y="112" width="150" height="62" rx="12" fill="#ffedc9" stroke="#b45f06" stroke-width="3"/><text x="130" y="150" fill="#4d290b">"rojo"</text>
    <rect x="225" y="112" width="150" height="62" rx="12" fill="#ffedc9" stroke="#b45f06" stroke-width="3"/><text x="300" y="150" fill="#4d290b">"verde"</text>
    <rect x="395" y="112" width="150" height="62" rx="12" fill="#ffedc9" stroke="#b45f06" stroke-width="3"/><text x="470" y="150" fill="#4d290b">"azul"</text>
    <rect x="565" y="112" width="150" height="62" rx="12" fill="#ffedc9" stroke="#b45f06" stroke-width="3"/><text x="640" y="150" fill="#4d290b">"negro"</text>
  </g>

  <!-- Índices negativos (at) -->
  <g font-size="13" font-weight="800" text-anchor="middle" fill="#1e40af">
    <text x="130" y="200">-4</text><text x="300" y="200">-3</text><text x="470" y="200">-2</text><text x="640" y="200">-1</text>
  </g>
  <text x="38" y="200" font-size="12" fill="#1e40af" font-weight="700">con at()</text>

  <!-- Etiquetas -->
  <g font-size="13" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" fill="#4d290b">
    <text x="130" y="236">colores[0]</text>
    <text x="640" y="236">colores[3]</text>
    <text x="640" y="258">colores.at(-1)</text>
  </g>
  <g font-size="12" text-anchor="middle" fill="#5f3109">
    <text x="130" y="256">primer elemento</text>
    <text x="640" y="280">último elemento</text>
  </g>

  <!-- length -->
  <path d="M55 292 L55 302 L715 302 L715 292" stroke="#783d06" stroke-width="2" fill="none"/>
  <text x="385" y="322" text-anchor="middle" font-size="14" font-weight="700" fill="#4d290b">colores.length es 4  ·  el último índice es length - 1 = 3</text>
</svg>
