<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="t">Los arreglos se guardan por referencia</title>
  <desc id="d">A la izquierda, dos variables a y b apuntan al mismo arreglo, así que un cambio hecho desde b también se ve desde a. A la derecha, Array(3).fill con un arreglo vacío hace que los tres huecos apunten al mismo arreglo, mientras que Array.from con una función crea tres arreglos distintos.</desc>
  <rect width="860" height="380" fill="#fffdf7"/>
  <text x="430" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#4d290b">Un arreglo se guarda por referencia</text>

  <!-- Izquierda -->
  <rect x="30" y="50" width="390" height="300" rx="14" fill="#ffedc9" stroke="#b45f06" stroke-width="2"/>
  <text x="225" y="78" text-anchor="middle" font-size="14" font-weight="800" fill="#4d290b">Asignar no copia</text>
  <g font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#4d290b">
    <text x="50" y="108">const original = [1, 2, 3];</text>
    <text x="50" y="130">const mismo = original;</text>
    <text x="50" y="152">mismo.push(4);</text>
  </g>
  <g font-family="ui-monospace, Menlo, monospace" font-size="14" font-weight="700" text-anchor="middle">
    <rect x="50" y="190" width="110" height="36" rx="8" fill="#ffffff" stroke="#b45f06"/><text x="105" y="214" fill="#4d290b">original</text>
    <rect x="50" y="256" width="110" height="36" rx="8" fill="#ffffff" stroke="#b45f06"/><text x="105" y="280" fill="#4d290b">mismo</text>
    <rect x="250" y="206" width="150" height="70" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="3"/><text x="325" y="248" fill="#14532d">[1, 2, 3, 4]</text>
  </g>
  <g stroke="#783d06" stroke-width="2.5" fill="#783d06">
    <line x1="162" y1="208" x2="244" y2="232"/><polygon points="248,234 234,224 232,238"/>
    <line x1="162" y1="274" x2="244" y2="250"/><polygon points="248,248 232,244 234,258"/>
  </g>
  <text x="225" y="318" text-anchor="middle" font-size="12" fill="#5f3109">Las dos variables apuntan al mismo arreglo:</text>
  <text x="225" y="336" text-anchor="middle" font-size="12" fill="#5f3109">el cambio se ve en ambas.</text>

  <!-- Derecha -->
  <rect x="440" y="50" width="390" height="300" rx="14" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="635" y="78" text-anchor="middle" font-size="14" font-weight="800" fill="#7f1d1d">La trampa de fill con un arreglo</text>
  <g font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#7f1d1d">
    <text x="460" y="108">Array(3).fill([])</text>
  </g>
  <g font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="700" text-anchor="middle">
    <rect x="460" y="122" width="56" height="34" rx="8" fill="#ffffff" stroke="#b91c1c"/><text x="488" y="144" fill="#7f1d1d">[0]</text>
    <rect x="460" y="164" width="56" height="34" rx="8" fill="#ffffff" stroke="#b91c1c"/><text x="488" y="186" fill="#7f1d1d">[1]</text>
    <rect x="460" y="206" width="56" height="34" rx="8" fill="#ffffff" stroke="#b91c1c"/><text x="488" y="228" fill="#7f1d1d">[2]</text>
    <rect x="640" y="150" width="150" height="62" rx="12" fill="#fecaca" stroke="#b91c1c" stroke-width="3"/><text x="715" y="186" fill="#7f1d1d">un solo []</text>
  </g>
  <g stroke="#b91c1c" stroke-width="2.5" fill="#b91c1c">
    <line x1="518" y1="140" x2="632" y2="174"/><polygon points="636,175 622,166 620,180"/>
    <line x1="518" y1="181" x2="632" y2="181"/><polygon points="636,181 622,174 622,188"/>
    <line x1="518" y1="222" x2="632" y2="190"/><polygon points="636,188 620,184 622,198"/>
  </g>
  <text x="460" y="268" font-size="12" fill="#7f1d1d">Si cambias uno, cambian los tres.</text>
  <rect x="460" y="282" width="350" height="52" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="635" y="304" text-anchor="middle" font-size="12" font-family="ui-monospace, Menlo, monospace" font-weight="700" fill="#14532d">Array.from({ length: 3 }, () => [])</text>
  <text x="635" y="322" text-anchor="middle" font-size="12" fill="#14532d">crea tres arreglos distintos</text>
</svg>
