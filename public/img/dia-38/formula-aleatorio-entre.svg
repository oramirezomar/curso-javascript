<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 340" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="t">La fórmula de un entero al azar entre dos valores</title>
  <desc id="d">Cuatro pasos para obtener un entero al azar entre 501 y 600, ambos incluidos. Math.random da un número desde 0 hasta casi 1. Multiplicarlo por la cantidad de valores posibles, 600 menos 501 más 1, que es 100, lo lleva a un intervalo de 0 a casi 100. Math.floor lo convierte en un entero de 0 a 99. Sumar el mínimo, 501, da un entero de 501 a 600. Un ejemplo: 0,4237 se convierte en 42,37, luego en 42 y luego en 543.</desc>
  <rect width="860" height="340" fill="#fffdf7"/>
  <text x="430" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#4d290b">Math.floor(Math.random() * (max - min + 1)) + min</text>
  <g>
    <rect x="20" y="62" width="190" height="130" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <rect x="236" y="62" width="190" height="130" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <rect x="452" y="62" width="190" height="130" rx="12" fill="#fef9c3" stroke="#a16207" stroke-width="2"/>
    <rect x="668" y="62" width="172" height="130" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  </g>
  <g font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="800" text-anchor="middle">
    <text x="115" y="90" fill="#1e3a8a">Math.random()</text>
    <text x="331" y="90" fill="#4c1d95">* 100</text>
    <text x="547" y="90" fill="#713f12">Math.floor()</text>
    <text x="754" y="90" fill="#14532d">+ 501</text>
  </g>
  <g font-size="13" text-anchor="middle">
    <g fill="#1e3a8a"><text x="115" y="124">de 0 a casi 1</text><text x="115" y="144">(1 no se incluye)</text></g>
    <g fill="#4c1d95"><text x="331" y="124">de 0 a casi 100</text><text x="331" y="144">100 = 600 − 501 + 1</text></g>
    <g fill="#713f12"><text x="547" y="124">entero de 0 a 99</text><text x="547" y="144">se descartan decimales</text></g>
    <g fill="#14532d"><text x="754" y="124">entero de 501 a 600</text><text x="754" y="144">se desplaza al rango</text></g>
  </g>
  <g font-family="ui-monospace, Menlo, monospace" font-size="16" font-weight="800" text-anchor="middle">
    <text x="115" y="176" fill="#1e3a8a">0.4237</text>
    <text x="331" y="176" fill="#4c1d95">42.37</text>
    <text x="547" y="176" fill="#713f12">42</text>
    <text x="754" y="176" fill="#14532d">543</text>
  </g>
  <g fill="none" stroke="#4d290b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M212 127 H232 M225 120 L232 127 L225 134"/>
    <path d="M428 127 H448 M441 120 L448 127 L441 134"/>
    <path d="M644 127 H664 M657 120 L664 127 L657 134"/>
  </g>
  <rect x="20" y="218" width="820" height="96" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <g font-size="13" fill="#78350f">
    <text x="38" y="246" font-weight="800">Por qué se usa floor y no round</text>
    <text x="38" y="268">Math.random() reparte los valores de forma uniforme entre 0 y 1. Con floor, cada entero recibe el mismo tramo.</text>
    <text x="38" y="288">Con round, los extremos reciben solo medio tramo, y además aparece un valor de más: 101 posibles en lugar de 100.</text>
    <text x="38" y="306" font-size="12">Math.random() no es seguro para contraseñas ni claves: para eso MDN indica usar crypto.getRandomValues().</text>
  </g>
</svg>
