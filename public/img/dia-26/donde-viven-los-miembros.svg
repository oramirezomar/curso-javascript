<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="t">Dónde vive cada miembro de una clase</title>
  <desc id="d">Tres objetos. La clase Perro contiene los miembros estáticos: creados, queEs y desdeTexto. Perro.prototype contiene constructor, ladrar y el getter y el setter de raza. La instancia scooby contiene sus propiedades propias nombre y _raza, y su prototipo es Perro.prototype. Perro y Perro.prototype se enlazan con las propiedades prototype y constructor. Una tabla muestra que scooby.ladrar funciona porque lo encuentra en Perro.prototype, que scooby.queEs lanza un TypeError porque los estáticos no están en su cadena, y que Perro.queEs funciona porque se llama sobre la propia clase.</desc>
  <rect width="860" height="440" fill="#fffdf7"/>
  <text x="430" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#4d290b">Los estáticos viven en la clase, los métodos en el prototipo</text>
  <g text-anchor="middle">
    <rect x="20" y="52" width="220" height="140" rx="12" fill="#fef9c3" stroke="#a16207" stroke-width="2"/>
    <text x="130" y="78" font-size="14" font-weight="800" fill="#713f12">Perro (la clase)</text>
    <g font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="700" fill="#713f12">
      <text x="130" y="108">static creados</text><text x="130" y="130">static queEs()</text><text x="130" y="152">static desdeTexto()</text>
    </g>
    <text x="130" y="178" font-size="11" fill="#713f12">miembros estáticos</text>
    <rect x="320" y="52" width="220" height="140" rx="12" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
    <text x="430" y="78" font-size="14" font-weight="800" fill="#312e81">Perro.prototype</text>
    <g font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="700" fill="#312e81">
      <text x="430" y="104">constructor</text><text x="430" y="124">ladrar()</text><text x="430" y="144">get raza</text><text x="430" y="164">set raza</text>
    </g>
    <rect x="620" y="52" width="220" height="140" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="730" y="78" font-size="14" font-weight="800" fill="#14532d">scooby (la instancia)</text>
    <g font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="700" fill="#14532d">
      <text x="730" y="118">nombre</text><text x="730" y="140">_raza</text>
    </g>
    <text x="730" y="178" font-size="11" fill="#14532d">propiedades propias</text>
  </g>
  <g stroke="#783d06" stroke-width="2.5" fill="#783d06">
    <line x1="618" y1="122" x2="550" y2="122"/><polygon points="552,116 542,122 552,128"/>
    <line x1="240" y1="96" x2="310" y2="96"/><polygon points="308,90 318,96 308,102"/>
    <line x1="318" y1="150" x2="250" y2="150"/><polygon points="252,144 242,150 252,156"/>
  </g>
  <g font-size="10" font-weight="700" fill="#783d06" text-anchor="middle">
    <text x="580" y="112">[[Prototype]]</text>
    <text x="280" y="86">prototype</text>
    <text x="280" y="140">constructor</text>
  </g>
  <!-- Tabla -->
  <g font-size="13" font-weight="800" text-anchor="middle" fill="#4d290b">
    <rect x="20" y="226" width="200" height="34" rx="8" fill="#ffedc9" stroke="#b45f06" stroke-width="2"/><text x="120" y="248">Llamada</text>
    <rect x="230" y="226" width="400" height="34" rx="8" fill="#ffedc9" stroke="#b45f06" stroke-width="2"/><text x="430" y="248">Dónde se busca</text>
    <rect x="640" y="226" width="200" height="34" rx="8" fill="#ffedc9" stroke="#b45f06" stroke-width="2"/><text x="740" y="248">Resultado</text>
  </g>
  <g stroke-width="1.5">
    <rect x="20" y="266" width="200" height="38" rx="8" fill="#ffffff" stroke="#e8c98a"/><rect x="230" y="266" width="400" height="38" rx="8" fill="#ffffff" stroke="#e8c98a"/><rect x="640" y="266" width="200" height="38" rx="8" fill="#dcfce7" stroke="#86efac"/>
    <rect x="20" y="310" width="200" height="38" rx="8" fill="#ffffff" stroke="#e8c98a"/><rect x="230" y="310" width="400" height="38" rx="8" fill="#ffffff" stroke="#e8c98a"/><rect x="640" y="310" width="200" height="38" rx="8" fill="#fee2e2" stroke="#fca5a5"/>
    <rect x="20" y="354" width="200" height="38" rx="8" fill="#ffffff" stroke="#e8c98a"/><rect x="230" y="354" width="400" height="38" rx="8" fill="#ffffff" stroke="#e8c98a"/><rect x="640" y="354" width="200" height="38" rx="8" fill="#dcfce7" stroke="#86efac"/>
  </g>
  <g font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="800" fill="#312e81" text-anchor="middle">
    <text x="120" y="290">scooby.ladrar()</text>
    <text x="120" y="334">scooby.queEs()</text>
    <text x="120" y="378">Perro.queEs()</text>
  </g>
  <g font-size="13" fill="#3b2410" text-anchor="middle">
    <text x="430" y="290">scooby, y luego Perro.prototype: ahí está</text>
    <text x="430" y="334">scooby, Perro.prototype, Object.prototype: no está</text>
    <text x="430" y="378">La propia clase Perro: ahí está</text>
  </g>
  <g font-size="13" font-weight="800" text-anchor="middle">
    <text x="740" y="290" fill="#14532d">funciona</text>
    <text x="740" y="334" fill="#7f1d1d">TypeError</text>
    <text x="740" y="378" fill="#14532d">funciona</text>
  </g>
  <text x="430" y="420" text-anchor="middle" font-size="12" font-weight="700" fill="#783d06">Cada flecha es un enlace: el [[Prototype]] de la instancia, y las propiedades prototype y constructor entre la clase y su prototipo.</text>
</svg>
