<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="t">Un entero aleatorio dentro de un rango</title>
  <desc id="d">Para obtener un entero aleatorio entre 1 y 6, ambos incluidos, se multiplica Math.random por 6, se aplica Math.floor y se suma 1. Con un valor de 0.83, el resultado es 4.98, luego 4 y luego 5. Debajo se comparan dos formas de convertir el número en un entero. Con Math.round de r por 3, los valores 0 y 3 salen 1000 veces y los valores 1 y 2, 2000 veces, así que los extremos salen la mitad de veces. Con Math.floor de r por 4, los cuatro valores salen 1500 veces cada uno, un reparto parejo.</desc>
  <rect width="860" height="440" fill="#fffdf7"/>
  <text x="430" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#4d290b">Math.floor(Math.random() * (max - min + 1)) + min</text>
  <g stroke-width="2" text-anchor="middle">
    <rect x="20" y="48" width="190" height="104" rx="12" fill="#e0e7ff" stroke="#4338ca"/>
    <text x="115" y="74" font-size="12" font-weight="800" fill="#312e81">1 · Decimal de 0 a casi 1</text>
    <text x="115" y="104" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="800" fill="#312e81">Math.random()</text>
    <text x="115" y="134" font-size="16" font-weight="800" fill="#312e81">0.83</text>
    <rect x="230" y="48" width="190" height="104" rx="12" fill="#dcfce7" stroke="#15803d"/>
    <text x="325" y="74" font-size="12" font-weight="800" fill="#14532d">2 · Se amplía al rango</text>
    <text x="325" y="104" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="800" fill="#14532d">* (6 - 1 + 1)</text>
    <text x="325" y="134" font-size="16" font-weight="800" fill="#14532d">4.98</text>
    <rect x="440" y="48" width="190" height="104" rx="12" fill="#fef9c3" stroke="#a16207"/>
    <text x="535" y="74" font-size="12" font-weight="800" fill="#713f12">3 · Se quitan decimales</text>
    <text x="535" y="104" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="800" fill="#713f12">Math.floor(...)</text>
    <text x="535" y="134" font-size="16" font-weight="800" fill="#713f12">4</text>
    <rect x="650" y="48" width="190" height="104" rx="12" fill="#ffedd5" stroke="#ea580c"/>
    <text x="745" y="74" font-size="12" font-weight="800" fill="#7c2d12">4 · Se suma el mínimo</text>
    <text x="745" y="104" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="800" fill="#7c2d12">+ 1</text>
    <text x="745" y="134" font-size="16" font-weight="800" fill="#7c2d12">5</text>
  </g>
  <g stroke="#783d06" stroke-width="2.5" fill="#783d06">
    <line x1="212" y1="100" x2="222" y2="100"/><polygon points="220,94 230,100 220,106"/>
    <line x1="422" y1="100" x2="432" y2="100"/><polygon points="430,94 440,100 430,106"/>
    <line x1="632" y1="100" x2="642" y2="100"/><polygon points="640,94 650,100 640,106"/>
  </g>
  <text x="430" y="186" text-anchor="middle" font-size="13" font-weight="800" fill="#4d290b">Cuántas veces sale cada valor al recorrer 6000 valores uniformes de r</text>
  <!-- Gráfico round -->
  <rect x="20" y="198" width="400" height="224" rx="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="220" y="222" text-anchor="middle" font-size="13" font-weight="800" fill="#7f1d1d">Math.round(r * 3): los extremos salen menos</text>
  <g fill="#ef4444"><rect x="60" y="326" width="56" height="48"/><rect x="148" y="278" width="56" height="96"/><rect x="236" y="278" width="56" height="96"/><rect x="324" y="326" width="56" height="48"/></g>
  <g font-size="13" font-weight="800" fill="#7f1d1d" text-anchor="middle">
    <text x="88" y="318">1000</text><text x="176" y="270">2000</text><text x="264" y="270">2000</text><text x="352" y="318">1000</text>
  </g>
  <line x1="40" y1="374" x2="400" y2="374" stroke="#7f1d1d" stroke-width="1.5"/>
  <g font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="800" fill="#7f1d1d" text-anchor="middle">
    <text x="88" y="394">0</text><text x="176" y="394">1</text><text x="264" y="394">2</text><text x="352" y="394">3</text>
  </g>
  <text x="220" y="414" text-anchor="middle" font-size="11" fill="#7f1d1d">0 y 3 salen la mitad de veces</text>
  <!-- Gráfico floor -->
  <rect x="440" y="198" width="400" height="224" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="640" y="222" text-anchor="middle" font-size="13" font-weight="800" fill="#14532d">Math.floor(r * 4): reparto parejo</text>
  <g fill="#22c55e"><rect x="480" y="302" width="56" height="72"/><rect x="568" y="302" width="56" height="72"/><rect x="656" y="302" width="56" height="72"/><rect x="744" y="302" width="56" height="72"/></g>
  <g font-size="13" font-weight="800" fill="#14532d" text-anchor="middle">
    <text x="508" y="294">1500</text><text x="596" y="294">1500</text><text x="684" y="294">1500</text><text x="772" y="294">1500</text>
  </g>
  <line x1="460" y1="374" x2="820" y2="374" stroke="#14532d" stroke-width="1.5"/>
  <g font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="800" fill="#14532d" text-anchor="middle">
    <text x="508" y="394">0</text><text x="596" y="394">1</text><text x="684" y="394">2</text><text x="772" y="394">3</text>
  </g>
  <text x="640" y="414" text-anchor="middle" font-size="11" fill="#14532d">los cuatro valores salen igual de seguido</text>
</svg>
