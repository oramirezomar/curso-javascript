<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="t">Un patrón como texto frente a un patrón como expresión regular</title>
  <desc id="d">Tres patrones y qué pasa si se pasan sin escapar a new RegExp. El patrón xyz funciona igual de las dos formas. El punto, sin escapar, es cualquier carácter y borra todo el texto, mientras que escapado solo borra los puntos. El paréntesis de apertura, sin escapar, lanza un error de sintaxis, y escapado se borra como cualquier otro carácter. La función de escape antepone una barra invertida a los caracteres con significado especial.</desc>
  <rect width="860" height="420" fill="#fffdf7"/>
  <text x="430" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#4d290b">Lo que escribe el usuario no es una expresión regular</text>
  <g font-size="13" font-weight="800" text-anchor="middle">
    <rect x="20" y="50" width="150" height="40" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="95" y="75" fill="#1e293b">Patrón</text>
    <rect x="180" y="50" width="330" height="40" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/><text x="345" y="75" fill="#7f1d1d">new RegExp(patron, "gi")</text>
    <rect x="520" y="50" width="320" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="680" y="75" fill="#14532d">new RegExp(escapar(patron), "gi")</text>
  </g>
  <g>
    <rect x="20" y="100" width="820" height="62" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="20" y="170" width="820" height="62" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="20" y="240" width="820" height="62" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  </g>
  <g font-family="ui-monospace, Menlo, monospace" font-size="16" font-weight="800" fill="#1e293b" text-anchor="middle">
    <text x="95" y="138">"xyz"</text><text x="95" y="208">"."</text><text x="95" y="278">"("</text>
  </g>
  <g font-size="13" font-weight="700" text-anchor="middle">
    <rect x="190" y="112" width="310" height="38" rx="6" fill="#dcfce7"/><text x="345" y="136" fill="#14532d">Funciona: "1xyz2xyz3" → "123"</text>
    <rect x="190" y="182" width="310" height="38" rx="6" fill="#fee2e2"/><text x="345" y="206" fill="#7f1d1d">«.» es cualquier carácter: borra todo</text>
    <rect x="190" y="252" width="310" height="38" rx="6" fill="#fee2e2"/><text x="345" y="276" fill="#7f1d1d">SyntaxError: paréntesis sin cerrar</text>
    <rect x="530" y="112" width="300" height="38" rx="6" fill="#dcfce7"/><text x="680" y="136" fill="#14532d">Igual: "1xyz2xyz3" → "123"</text>
    <rect x="530" y="182" width="300" height="38" rx="6" fill="#dcfce7"/><text x="680" y="206" fill="#14532d">Solo borra los puntos: "a.b.c" → "abc"</text>
    <rect x="530" y="252" width="300" height="38" rx="6" fill="#dcfce7"/><text x="680" y="276" fill="#14532d">Borra los paréntesis: "(1)" → "1)"</text>
  </g>
  <rect x="20" y="318" width="820" height="86" rx="12" fill="#1e293b"/>
  <g font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="700" fill="#f8fafc">
    <text x="38" y="346" fill="#fde68a">// Antepone una barra invertida a los caracteres con significado especial</text>
    <text x="38" y="368">const escapar = (texto) =&gt;</text>
    <text x="38" y="388">&#160;&#160;texto.replace(/[.*+?^${}()|[\]\\]/g, "\\$&amp;");</text>
  </g>
</svg>
