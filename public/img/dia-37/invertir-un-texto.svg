<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="t">Invertir un texto en tres pasos</title>
  <desc id="d">El texto hola se convierte en un arreglo de letras con split o con el operador de propagación, el arreglo se invierte con reverse, y se vuelve a unir en un texto con join, que da aloh. Abajo se compara qué pasa con un texto que contiene un emoji: split con un texto vacío lo parte en unidades de dos mitades, y el operador de propagación lo mantiene entero.</desc>
  <rect width="860" height="400" fill="#fffdf7"/>
  <text x="430" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#4d290b">Texto → arreglo → invertido → texto</text>
  <g font-family="ui-monospace, Menlo, monospace" font-weight="800" text-anchor="middle">
    <rect x="20" y="60" width="150" height="64" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="95" y="98" font-size="20" fill="#1e3a8a">"hola"</text>
    <rect x="226" y="60" width="190" height="64" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="321" y="98" font-size="15" fill="#4c1d95">["h","o","l","a"]</text>
    <rect x="472" y="60" width="190" height="64" rx="10" fill="#fef9c3" stroke="#a16207" stroke-width="2"/>
    <text x="567" y="98" font-size="15" fill="#713f12">["a","l","o","h"]</text>
    <rect x="718" y="60" width="122" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="779" y="98" font-size="20" fill="#14532d">"aloh"</text>
  </g>
  <g fill="none" stroke="#4d290b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M174 92 H222 M214 85 L222 92 L214 99"/>
    <path d="M420 92 H468 M460 85 L468 92 L460 99"/>
    <path d="M666 92 H714 M706 85 L714 92 L706 99"/>
  </g>
  <g font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="800" text-anchor="middle" fill="#4d290b">
    <text x="198" y="146">split("")</text>
    <text x="198" y="164" font-size="11" font-weight="400" font-family="system-ui, sans-serif">o [...texto]</text>
    <text x="444" y="146">reverse()</text>
    <text x="444" y="164" font-size="11" font-weight="400" font-family="system-ui, sans-serif">invierte el arreglo</text>
    <text x="690" y="146">join("")</text>
    <text x="690" y="164" font-size="11" font-weight="400" font-family="system-ui, sans-serif">vuelve a unir</text>
  </g>
  <rect x="20" y="198" width="820" height="172" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="38" y="226" font-size="14" font-weight="800" fill="#7c2d12">Con un emoji, no todos los métodos de partir son iguales</text>
  <g font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="800">
    <text x="38" y="256" fill="#7c2d12">"a😀b".split("")</text>
    <rect x="260" y="238" width="60" height="26" rx="5" fill="#fecaca" stroke="#b91c1c" stroke-width="1.5"/><text x="290" y="256" text-anchor="middle" fill="#7f1d1d">"a"</text>
    <rect x="326" y="238" width="60" height="26" rx="5" fill="#fecaca" stroke="#b91c1c" stroke-width="1.5"/><text x="356" y="256" text-anchor="middle" fill="#7f1d1d">�</text>
    <rect x="392" y="238" width="60" height="26" rx="5" fill="#fecaca" stroke="#b91c1c" stroke-width="1.5"/><text x="422" y="256" text-anchor="middle" fill="#7f1d1d">�</text>
    <rect x="458" y="238" width="60" height="26" rx="5" fill="#fecaca" stroke="#b91c1c" stroke-width="1.5"/><text x="488" y="256" text-anchor="middle" fill="#7f1d1d">"b"</text>
    <text x="540" y="256" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#7f1d1d">4 trozos: el emoji se parte en dos mitades</text>
    <text x="38" y="304" fill="#14532d">[..."a😀b"]</text>
    <rect x="260" y="286" width="60" height="26" rx="5" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/><text x="290" y="304" text-anchor="middle" fill="#14532d">"a"</text>
    <rect x="326" y="286" width="126" height="26" rx="5" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/><text x="389" y="304" text-anchor="middle" fill="#14532d">"😀"</text>
    <rect x="458" y="286" width="60" height="26" rx="5" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/><text x="488" y="304" text-anchor="middle" fill="#14532d">"b"</text>
    <text x="540" y="304" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#14532d">3 trozos: el emoji sigue entero</text>
  </g>
  <text x="38" y="346" font-size="12" fill="#7c2d12">Invertir un emoji partido en dos mitades da un texto con caracteres rotos. Por eso el reto usa [...texto].</text>
</svg>
