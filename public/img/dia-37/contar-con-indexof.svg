  <text x="398" y="228" font-family="ui-monospace, Menlo, monospace" font-size="26" font-weight="800" fill="#4c1d95">17</text>
  <text x="318" y="262" font-size="14" font-weight="800" fill="#4c1d95">contador = 2</text>
  <rect x="576" y="150" width="264" height="130" rx="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <circle cx="604" cy="180" r="14" fill="#b91c1c"/><text x="604" y="186" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">3</text>
  <text x="628" y="186" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="800" fill="#7f1d1d">indexOf("mundo", 22)</text>
  <text x="596" y="226" font-size="14" fill="#7f1d1d">devuelve</text>
  <text x="676" y="228" font-family="ui-monospace, Menlo, monospace" font-size="26" font-weight="800" fill="#7f1d1d">-1</text>
  <text x="596" y="262" font-size="14" font-weight="800" fill="#7f1d1d">se termina</text>
  <text x="430" y="312" text-anchor="middle" font-size="13" fill="#4d290b">Cada búsqueda empieza en la posición siguiente a la última aparición: la anterior más la longitud de la palabra.</text>
  <rect x="20" y="330" width="820" height="50" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="38" y="352" font-size="13" font-weight="800" fill="#78350f">Dos detalles:</text>
  <text x="38" y="370" font-size="12.5" fill="#78350f">avanzar de uno en uno cuenta apariciones solapadas ("aa" en "aaaa" daría 3), y buscar un texto vacío nunca devuelve -1.</text>
