<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="t">Contar apariciones con indexOf</title>
  <desc id="d">El texto hola mundo adiós mundo tiene 22 posiciones. La palabra mundo aparece en la posición 5 y en la 17. Se busca con indexOf desde la posición 0 y devuelve 5, el contador pasa a 1. Después se busca desde la 10, que es 5 más la longitud de la palabra, y devuelve 17, el contador pasa a 2. Se busca desde la 22 y devuelve menos 1, así que se termina con un contador de 2.</desc>
