<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="t">Modelo, instancias, atributos y métodos</title>
  <desc id="d">A la izquierda, el modelo Animal, con los atributos nombre y genero y los métodos sonar y saludar. A la derecha, dos instancias creadas con new a partir de ese modelo: snoopy, con nombre Snoopy y genero macho, y lola, con nombre Lola Bunny y genero hembra. Abajo, cuatro definiciones: la clase o modelo, la instancia, los atributos que son variables dentro de un objeto y los métodos que son funciones dentro de un objeto.</desc>
  <rect width="860" height="440" fill="#fffdf7"/>
  <text x="430" y="28" text-anchor="middle" font-size="20" font-weight="700" fill="#4d290b">Un modelo, varias instancias</text>

  <!-- Flechas (antes de las cajas) -->
  <g stroke="#783d06" stroke-width="2.5" fill="#783d06">
    <line x1="330" y1="120" x2="508" y2="112"/><polygon points="506,106 518,112 506,118"/>
    <line x1="330" y1="224" x2="508" y2="232"/><polygon points="506,226 518,232 506,238"/>
  </g>
  <g font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="800" fill="#783d06" text-anchor="middle">
    <text x="424" y="104">new</text>
    <text x="424" y="256">new</text>
  </g>

  <!-- Modelo -->
  <rect x="30" y="52" width="300" height="220" rx="14" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
  <rect x="30" y="52" width="300" height="40" rx="14" fill="#4338ca"/>
  <rect x="30" y="76" width="300" height="16" fill="#4338ca"/>
  <text x="180" y="79" text-anchor="middle" font-size="16" font-weight="800" fill="#ffffff">Animal (el modelo)</text>
  <g font-size="13" font-weight="800" fill="#312e81">
    <text x="50" y="118">Atributos</text>
    <text x="50" y="196">Métodos</text>
  </g>
  <g font-family="ui-monospace, Menlo, monospace" font-size="14" font-weight="700" fill="#312e81">
    <text x="70" y="140">nombre</text>
    <text x="70" y="162">genero</text>
    <text x="70" y="218">sonar()</text>
    <text x="70" y="240">saludar()</text>
  </g>

  <!-- Instancias -->
  <rect x="520" y="52" width="310" height="120" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="540" y="78" font-size="14" font-weight="800" fill="#14532d">snoopy (una instancia)</text>
  <g font-family="ui-monospace, Menlo, monospace" font-size="14" font-weight="700" fill="#14532d">
    <text x="540" y="108">nombre: "Snoopy"</text>
    <text x="540" y="132">genero: "macho"</text>
  </g>
  <rect x="520" y="184" width="310" height="120" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="540" y="210" font-size="14" font-weight="800" fill="#14532d">lola (otra instancia)</text>
  <g font-family="ui-monospace, Menlo, monospace" font-size="14" font-weight="700" fill="#14532d">
    <text x="540" y="240">nombre: "Lola Bunny"</text>
    <text x="540" y="264">genero: "hembra"</text>
  </g>

  <!-- Definiciones -->
  <g>
    <rect x="30" y="324" width="190" height="96" rx="10" fill="#ffffff" stroke="#e8c98a" stroke-width="2"/>
    <rect x="230" y="324" width="190" height="96" rx="10" fill="#ffffff" stroke="#e8c98a" stroke-width="2"/>
    <rect x="430" y="324" width="190" height="96" rx="10" fill="#ffffff" stroke="#e8c98a" stroke-width="2"/>
    <rect x="630" y="324" width="200" height="96" rx="10" fill="#ffffff" stroke="#e8c98a" stroke-width="2"/>
  </g>
  <g font-size="13" font-weight="800" fill="#4d290b" text-anchor="middle">
    <text x="125" y="348">Clase o modelo</text>
    <text x="325" y="348">Instancia</text>
    <text x="525" y="348">Atributos</text>
    <text x="730" y="348">Métodos</text>
  </g>
  <g font-size="12" fill="#3b2410" text-anchor="middle">
    <text x="125" y="372">Un molde para crear</text><text x="125" y="390">objetos del mismo tipo.</text>
    <text x="325" y="372">Un objeto creado a partir</text><text x="325" y="390">del modelo con new.</text>
    <text x="525" y="372">Las características:</text><text x="525" y="390">variables dentro del objeto.</text>
    <text x="730" y="372">Las acciones: funciones</text><text x="730" y="390">dentro del objeto.</text>
  </g>
</svg>
