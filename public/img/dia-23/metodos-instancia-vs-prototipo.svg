<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="t">Métodos dentro del constructor frente a métodos en el prototipo</title>
  <desc id="d">A la izquierda, cuando los métodos se escriben dentro del constructor con this, cada instancia crea sus propias copias de las funciones sonar y saludar: dos instancias tienen cuatro funciones. A la derecha, cuando los métodos se asignan a Animal.prototype, hay una sola copia de cada función y las dos instancias la comparten a través de su prototipo: dos funciones en total.</desc>
  <rect width="860" height="440" fill="#fffdf7"/>
  <text x="430" y="28" text-anchor="middle" font-size="20" font-weight="700" fill="#4d290b">¿Dónde viven los métodos?</text>

  <rect x="20" y="44" width="400" height="300" rx="14" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
  <rect x="440" y="44" width="400" height="300" rx="14" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <g text-anchor="middle" font-size="14" font-weight="800">
    <text x="220" y="70" fill="#7f1d1d">Dentro del constructor (this.sonar = ...)</text>
    <text x="640" y="70" fill="#14532d">En el prototipo (Animal.prototype.sonar = ...)</text>
  </g>

  <!-- Izquierda: dos instancias, cada una con su copia -->
  <rect x="40" y="92" width="170" height="190" rx="12" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
  <rect x="230" y="92" width="170" height="190" rx="12" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
  <g text-anchor="middle" font-size="13" font-weight="800" fill="#7f1d1d">
    <text x="125" y="114">snoopy</text>
    <text x="315" y="114">lola</text>
  </g>
  <g font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="700" fill="#3b2410" text-anchor="middle">
    <text x="125" y="140">nombre, genero</text>
    <text x="315" y="140">nombre, genero</text>
  </g>
  <g text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="800">
    <rect x="54" y="156" width="142" height="32" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="125" y="177" fill="#7f1d1d">sonar (copia 1)</text>
    <rect x="54" y="196" width="142" height="32" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="125" y="217" fill="#7f1d1d">saludar (copia 1)</text>
    <rect x="244" y="156" width="142" height="32" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="315" y="177" fill="#7f1d1d">sonar (copia 2)</text>
    <rect x="244" y="196" width="142" height="32" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="315" y="217" fill="#7f1d1d">saludar (copia 2)</text>
  </g>
  <text x="220" y="302" text-anchor="middle" font-size="12" font-weight="700" fill="#7f1d1d">Cada instancia crea sus propias funciones.</text>
  <text x="220" y="322" text-anchor="middle" font-size="14" font-weight="800" fill="#7f1d1d">2 instancias = 4 funciones</text>

  <!-- Derecha: prototipo compartido -->
  <rect x="520" y="90" width="240" height="84" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="640" y="112" text-anchor="middle" font-size="13" font-weight="800" fill="#14532d">Animal.prototype</text>
  <g text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="800" fill="#14532d">
    <text x="640" y="136">sonar</text>
    <text x="640" y="156">saludar</text>
  </g>
  <g stroke="#15803d" stroke-width="2.5" fill="#15803d">
    <line x1="540" y1="238" x2="570" y2="180"/><polygon points="564,184 572,174 574,186"/>
    <line x1="740" y1="238" x2="710" y2="180"/><polygon points="706,186 708,174 716,184"/>
  </g>
  <text x="640" y="206" text-anchor="middle" font-size="11" font-weight="700" fill="#14532d">[[Prototype]]</text>
  <rect x="460" y="238" width="160" height="62" rx="12" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
  <rect x="660" y="238" width="160" height="62" rx="12" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
  <g text-anchor="middle" font-size="13" font-weight="800" fill="#14532d">
    <text x="540" y="260">snoopy</text>
    <text x="740" y="260">lola</text>
  </g>
  <g text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="700" fill="#3b2410">
    <text x="540" y="284">nombre, genero</text>
    <text x="740" y="284">nombre, genero</text>
  </g>
  <text x="640" y="322" text-anchor="middle" font-size="14" font-weight="800" fill="#14532d">2 instancias = 2 funciones compartidas</text>

  <rect x="60" y="360" width="740" height="64" rx="12" fill="#ffedc9" stroke="#b45f06" stroke-width="2"/>
  <text x="430" y="386" text-anchor="middle" font-size="14" font-weight="800" fill="#4d290b">Con 100 animales: 200 funciones copiadas o solo 2 compartidas.</text>
  <text x="430" y="408" text-anchor="middle" font-size="13" fill="#4d290b">Los atributos van en el constructor; los métodos, en el prototipo.</text>
</svg>
