  <title id="t">|| frente a ?? con un valor por defecto</title>
  <desc id="d">Resultado de valor || "defecto" y de valor ?? "defecto" para siete valores. Con 0, || da "defecto" y ?? da 0. Con la cadena vacía, || da "defecto" y ?? da la cadena vacía. Con false, || da "defecto" y ?? da false. Con NaN, || da "defecto" y ?? da NaN. Con null, ambos dan "defecto". Con undefined, ambos dan "defecto". Con "hola", ambos dan "hola". El operador || sustituye cualquier valor falso, y ?? solo sustituye null y undefined.</desc>
