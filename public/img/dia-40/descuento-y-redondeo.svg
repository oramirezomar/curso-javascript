<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 410" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="t">Aplicar un descuento y redondear el dinero</title>
  <desc id="d">La fórmula del importe final es monto menos monto por descuento entre 100. Con 1000 y un 20 por ciento da 800, y con 19,99 y un 15 por ciento da 16,9915, que se redondea a 16,99. El descuento debe estar entre 0 y 100: con 150 por ciento el importe sería negativo, menos 500. Con dinero, redondear con decimales de coma flotante puede fallar: 1,15 con un 10 por ciento es 1,035, y Math.round de 1,035 por 100 entre 100 da 1,03, mientras que con céntimos enteros da 1,04.</desc>
  <rect width="860" height="410" fill="#fffdf7"/>
  <text x="430" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#4d290b">final = monto − monto × descuento / 100</text>
  <g>
    <rect x="20" y="54" width="266" height="120" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <rect x="297" y="54" width="266" height="120" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <rect x="574" y="54" width="266" height="120" rx="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  </g>
  <g font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="800">
    <text x="36" y="82" fill="#14532d">(1000, 20)</text>
    <text x="313" y="82" fill="#1e3a8a">(19.99, 15)</text>
    <text x="590" y="82" fill="#7f1d1d">(1000, 150)</text>
  </g>
  <g font-family="ui-monospace, Menlo, monospace" font-size="26" font-weight="800">
    <text x="36" y="122" fill="#14532d">800</text>
    <text x="313" y="122" fill="#1e3a8a">16.99</text>
    <text x="590" y="122" fill="#7f1d1d">-500</text>
  </g>
  <g font-size="12.5">
    <text x="36" y="150" fill="#14532d">1000 − 200</text>
    <text x="313" y="150" fill="#1e3a8a">16.9915 redondeado a 2 decimales</text>
    <text x="590" y="150" fill="#7f1d1d">Un descuento de más de 100 %</text>
    <text x="590" y="166" fill="#7f1d1d">daría un importe negativo.</text>
  </g>
  <text x="20" y="214" font-size="14" font-weight="800" fill="#1e293b">Redondear 1.15 con un 10 % de descuento (1.035 en papel)</text>
  <g>
    <rect x="20" y="228" width="400" height="108" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
    <rect x="440" y="228" width="400" height="108" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  </g>
  <g font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="800">
    <text x="36" y="256" fill="#78350f">Math.round(1.035 * 100) / 100</text>
    <text x="456" y="256" fill="#14532d">céntimos enteros</text>
  </g>
  <g font-family="ui-monospace, Menlo, monospace" font-size="28" font-weight="800">
    <text x="36" y="298" fill="#78350f">1.03</text>
    <text x="456" y="298" fill="#14532d">1.04</text>
  </g>
  <g font-size="12.5">
    <text x="36" y="322" fill="#78350f">1.035 × 100 da 103.49999999999999: se redondea hacia abajo.</text>
    <text x="456" y="322" fill="#14532d">115 céntimos × 90 / 100 = 103.5, y 103.5 se redondea a 104.</text>
  </g>
  <text x="430" y="370" text-anchor="middle" font-size="12.5" fill="#4d290b">Los decimales de coma flotante no representan con exactitud los céntimos: para dinero conviene calcular con enteros.</text>
  <text x="430" y="392" text-anchor="middle" font-size="12" fill="#64748b">En el reto, 19.99 con un 15 % da el mismo resultado de las dos formas: 16.99.</text>
</svg>
