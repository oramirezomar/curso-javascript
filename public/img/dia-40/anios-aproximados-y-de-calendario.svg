<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="t">Años por 365 días frente a años de calendario</title>
  <desc id="d">Tabla con seis casos que comparan dividir los milisegundos entre 365 días con comparar el calendario. Nacido el 23 de mayo de 1984: el 30 de marzo de 2020 dan 35 y 35; el 22 de mayo de 2020 el cálculo de 365 días da 36, que es un error, y el calendario da 35; el 23 de mayo de 2020 dan 36 y 36. Nacido el 1 de enero de 2000: el 31 de diciembre de 2003 el cálculo de 365 días da 4, que es un error, y el calendario da 3; el 31 de diciembre de 2023 da 24, que es un error, y el calendario da 23. Para la fecha futura del 23 de mayo de 2084, desde el 30 de marzo de 2020, da menos 65, que es un error, y el calendario da 64 años completos. El cálculo de 365 días ignora los días bisiestos acumulados.</desc>
  <rect width="860" height="440" fill="#fffdf7"/>
  <text x="430" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#4d290b">Dividir entre 365 días se desfasa con los bisiestos</text>
  <g font-size="13" font-weight="800" text-anchor="middle">
    <rect x="20" y="50" width="280" height="40" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="160" y="75" fill="#1e293b">Caso</text>
    <rect x="310" y="50" width="170" height="40" rx="8" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/><text x="395" y="75" fill="#713f12">ms / (365 días)</text>
    <rect x="490" y="50" width="170" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="575" y="75" fill="#14532d">Calendario</text>
    <rect x="670" y="50" width="170" height="40" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="755" y="75" fill="#0c4a6e">Resultado</text>
  </g>
  <g>
    <rect x="20" y="98" width="820" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="20" y="148" width="820" height="44" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.8"/>
    <rect x="20" y="198" width="820" height="44" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="20" y="248" width="820" height="44" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.8"/>
    <rect x="20" y="298" width="820" height="44" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.8"/>
    <rect x="20" y="348" width="820" height="44" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.8"/>
  </g>
  <g font-size="13" fill="#1e293b">
    <text x="34" y="125" font-weight="700">Nacido 23/05/1984, hoy 30/03/2020</text>
    <text x="34" y="175" font-weight="700">Nacido 23/05/1984, hoy 22/05/2020</text>
    <text x="34" y="225" font-weight="700">Nacido 23/05/1984, hoy 23/05/2020</text>
    <text x="34" y="275" font-weight="700">Nacido 01/01/2000, hoy 31/12/2003</text>
    <text x="34" y="325" font-weight="700">Nacido 01/01/2000, hoy 31/12/2023</text>
    <text x="34" y="375" font-weight="700">Fecha futura 23/05/2084, hoy 30/03/2020</text>
  </g>
  <g font-family="ui-monospace, Menlo, monospace" font-size="16" font-weight="800" text-anchor="middle">
    <text x="395" y="127" fill="#1e293b">35</text><text x="575" y="127" fill="#14532d">35</text>
    <text x="395" y="177" fill="#7f1d1d">36</text><text x="575" y="177" fill="#14532d">35</text>
    <text x="395" y="227" fill="#1e293b">36</text><text x="575" y="227" fill="#14532d">36</text>
    <text x="395" y="277" fill="#7f1d1d">4</text><text x="575" y="277" fill="#14532d">3</text>
    <text x="395" y="327" fill="#7f1d1d">24</text><text x="575" y="327" fill="#14532d">23</text>
    <text x="395" y="377" fill="#7f1d1d">-65</text><text x="575" y="377" fill="#14532d">-64</text>
  </g>
  <g font-size="12.5" font-weight="700" text-anchor="middle">
    <text x="755" y="125" fill="#14532d">Coinciden</text>
    <text x="755" y="175" fill="#7f1d1d">Falla: un día antes</text>
    <text x="755" y="225" fill="#14532d">Coinciden</text>
    <text x="755" y="275" fill="#7f1d1d">Falla: un día antes</text>
    <text x="755" y="325" fill="#7f1d1d">Falla: un día antes</text>
    <text x="755" y="375" fill="#7f1d1d">Falla en 1 año</text>
  </g>
  <text x="430" y="420" text-anchor="middle" font-size="12.5" fill="#4d290b">Cada cuatro años se acumula un día de más (29 de febrero): un año de 365 días ya no es un año de calendario.</text>
</svg>
