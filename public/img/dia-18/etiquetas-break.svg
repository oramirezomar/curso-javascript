<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="t">break con y sin etiqueta en ciclos anidados</title>
  <desc id="d">Dos tablas de multiplicar de 5 por 5 recorridas con dos ciclos anidados, buscando el primer producto igual a 12. Sin etiqueta, el break solo sale del ciclo interno y el ciclo externo sigue: se hacen 22 pasos y se encuentra también el producto 4 por 3. Con la etiqueta externo, el break sale de los dos ciclos al encontrar 3 por 4: se hacen 14 pasos.</desc>
