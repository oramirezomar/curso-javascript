  <text x="430" y="28" text-anchor="middle" font-size="20" font-weight="700" fill="#4d290b">Buscar el primer producto igual a 12</text>

  <rect x="20" y="42" width="400" height="340" rx="14" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
