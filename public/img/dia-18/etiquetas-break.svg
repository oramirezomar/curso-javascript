    <text x="640" y="68" font-family="ui-monospace, Menlo, monospace" font-size="15" font-weight="800" fill="#14532d">break externo;</text>
    <text x="640" y="88" font-size="12" fill="#14532d">sale de los dos ciclos</text>
  </g>

