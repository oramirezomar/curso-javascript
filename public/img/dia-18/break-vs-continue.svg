<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="t">break frente a continue en un for</title>
  <desc id="d">Un arreglo con los valores 1, 2, 3, 4, 5, 6, 7, 8, 9 y 0 recorrido con un for. Con break cuando i vale 5, el ciclo se detiene en el valor 6 y los valores 7, 8, 9 y 0 no se ejecutan: imprime 1 2 3 4 5. Con continue cuando i vale 5, solo se salta el valor 6 y el ciclo sigue: imprime 1 2 3 4 5 7 8 9 0.</desc>
  <rect width="860" height="420" fill="#fffdf7"/>
  <text x="430" y="28" text-anchor="middle" font-size="20" font-weight="700" fill="#4d290b">Mismo ciclo, dos instrucciones distintas</text>

  <!-- Fondos de fila -->
  <rect x="20" y="42" width="820" height="170" rx="14" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
  <rect x="20" y="222" width="820" height="170" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>

  <text x="40" y="66" font-family="ui-monospace, Menlo, monospace" font-size="14" font-weight="800" fill="#7f1d1d">if (i === 5) { break; }</text>
  <text x="40" y="246" font-family="ui-monospace, Menlo, monospace" font-size="14" font-weight="800" fill="#7c2d12">if (i === 5) { continue; }</text>

  <!-- Marcadores -->
  <g font-size="12" font-weight="800" text-anchor="middle">
    <text x="466" y="88" fill="#7f1d1d">break: sale del ciclo</text>
    <text x="466" y="268" fill="#7c2d12">continue: salta esta vuelta</text>
  </g>
  <g stroke="#783d06" stroke-width="2" fill="#783d06">
    <line x1="466" y1="92" x2="466" y2="102"/><polygon points="460,100 466,108 472,100"/>
    <line x1="466" y1="272" x2="466" y2="282"/><polygon points="460,280 466,288 472,280"/>
  </g>

  <!-- Fila break: cy=130 -->
  <g stroke-width="2.5" text-anchor="middle" font-size="18" font-weight="800">
    <circle cx="66" cy="130" r="22" fill="#dcfce7" stroke="#15803d"/><text x="66" y="136" fill="#14532d">1</text>
    <circle cx="146" cy="130" r="22" fill="#dcfce7" stroke="#15803d"/><text x="146" y="136" fill="#14532d">2</text>
    <circle cx="226" cy="130" r="22" fill="#dcfce7" stroke="#15803d"/><text x="226" y="136" fill="#14532d">3</text>
    <circle cx="306" cy="130" r="22" fill="#dcfce7" stroke="#15803d"/><text x="306" y="136" fill="#14532d">4</text>
    <circle cx="386" cy="130" r="22" fill="#dcfce7" stroke="#15803d"/><text x="386" y="136" fill="#14532d">5</text>
    <circle cx="466" cy="130" r="22" fill="#fecaca" stroke="#b91c1c"/><text x="466" y="136" fill="#7f1d1d">6</text>
    <circle cx="546" cy="130" r="22" fill="#f3f4f6" stroke="#9ca3af" stroke-dasharray="5 4"/><text x="546" y="136" fill="#9ca3af">7</text>
    <circle cx="626" cy="130" r="22" fill="#f3f4f6" stroke="#9ca3af" stroke-dasharray="5 4"/><text x="626" y="136" fill="#9ca3af">8</text>
    <circle cx="706" cy="130" r="22" fill="#f3f4f6" stroke="#9ca3af" stroke-dasharray="5 4"/><text x="706" y="136" fill="#9ca3af">9</text>
    <circle cx="786" cy="130" r="22" fill="#f3f4f6" stroke="#9ca3af" stroke-dasharray="5 4"/><text x="786" y="136" fill="#9ca3af">0</text>
  </g>
  <g font-size="11" text-anchor="middle" fill="#6b7280">
    <text x="66" y="170">i=0</text><text x="146" y="170">i=1</text><text x="226" y="170">i=2</text><text x="306" y="170">i=3</text><text x="386" y="170">i=4</text>
    <text x="466" y="170">i=5</text><text x="546" y="170">i=6</text><text x="626" y="170">i=7</text><text x="706" y="170">i=8</text><text x="786" y="170">i=9</text>
  </g>
  <text x="40" y="198" font-size="14" font-weight="800" fill="#7f1d1d">Imprime: 1 2 3 4 5</text>

  <!-- Fila continue: cy=310 -->
  <g stroke-width="2.5" text-anchor="middle" font-size="18" font-weight="800">
    <circle cx="66" cy="310" r="22" fill="#dcfce7" stroke="#15803d"/><text x="66" y="316" fill="#14532d">1</text>
    <circle cx="146" cy="310" r="22" fill="#dcfce7" stroke="#15803d"/><text x="146" y="316" fill="#14532d">2</text>
    <circle cx="226" cy="310" r="22" fill="#dcfce7" stroke="#15803d"/><text x="226" y="316" fill="#14532d">3</text>
    <circle cx="306" cy="310" r="22" fill="#dcfce7" stroke="#15803d"/><text x="306" y="316" fill="#14532d">4</text>
    <circle cx="386" cy="310" r="22" fill="#dcfce7" stroke="#15803d"/><text x="386" y="316" fill="#14532d">5</text>
    <circle cx="466" cy="310" r="22" fill="#fed7aa" stroke="#ea580c" stroke-dasharray="5 4"/><text x="466" y="316" fill="#7c2d12">6</text>
    <circle cx="546" cy="310" r="22" fill="#dcfce7" stroke="#15803d"/><text x="546" y="316" fill="#14532d">7</text>
    <circle cx="626" cy="310" r="22" fill="#dcfce7" stroke="#15803d"/><text x="626" y="316" fill="#14532d">8</text>
    <circle cx="706" cy="310" r="22" fill="#dcfce7" stroke="#15803d"/><text x="706" y="316" fill="#14532d">9</text>
    <circle cx="786" cy="310" r="22" fill="#dcfce7" stroke="#15803d"/><text x="786" y="316" fill="#14532d">0</text>
  </g>
  <g font-size="11" text-anchor="middle" fill="#6b7280">
    <text x="66" y="350">i=0</text><text x="146" y="350">i=1</text><text x="226" y="350">i=2</text><text x="306" y="350">i=3</text><text x="386" y="350">i=4</text>
    <text x="466" y="350">i=5</text><text x="546" y="350">i=6</text><text x="626" y="350">i=7</text><text x="706" y="350">i=8</text><text x="786" y="350">i=9</text>
  </g>
  <text x="40" y="378" font-size="14" font-weight="800" fill="#7c2d12">Imprime: 1 2 3 4 5 7 8 9 0</text>

  <!-- Leyenda -->
  <g font-size="12" fill="#4d290b">
    <circle cx="230" cy="408" r="6" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="242" y="412">se ejecuta</text>
    <circle cx="360" cy="408" r="6" fill="#fecaca" stroke="#b91c1c" stroke-width="2"/><text x="372" y="412">la vuelta con break</text>
    <circle cx="530" cy="408" r="6" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/><text x="542" y="412">la vuelta que continue salta</text>
    <circle cx="730" cy="408" r="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text x="742" y="412">no se ejecuta</text>
  </g>
</svg>
