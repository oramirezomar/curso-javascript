<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="t">El orden de las operaciones y el redondeo</title>
  <desc id="d">Dos cálculos de 37 grados Celsius a Fahrenheit. Multiplicando primero y dividiendo después, 37 por 9 entre 5 más 32, el resultado es exactamente 98,6. Calculando antes la fracción, 37 por paréntesis 9 entre 5 más 32, el resultado es 98,60000000000001. Después, tres formas de redondear 37,7777 grados: Math.round da 38 y pierde los decimales, Math.round de x por 100 entre 100 da 37,78 como número, y toFixed de 2 da 37.78 pero como texto.</desc>
  <rect width="860" height="400" fill="#fffdf7"/>
  <text x="430" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#4d290b">Primero multiplicar, y después redondear</text>
  <rect x="20" y="52" width="400" height="104" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="38" y="80" font-family="ui-monospace, Menlo, monospace" font-size="15" font-weight="800" fill="#14532d">37 * 9 / 5 + 32</text>
  <text x="38" y="120" font-family="ui-monospace, Menlo, monospace" font-size="26" font-weight="800" fill="#14532d">98.6</text>
  <text x="38" y="142" font-size="12.5" fill="#14532d">Se multiplica por 9 y se divide entre 5.</text>
  <rect x="440" y="52" width="400" height="104" rx="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="458" y="80" font-family="ui-monospace, Menlo, monospace" font-size="15" font-weight="800" fill="#7f1d1d">37 * (9 / 5) + 32</text>
  <text x="458" y="120" font-family="ui-monospace, Menlo, monospace" font-size="26" font-weight="800" fill="#7f1d1d">98.60000000000001</text>
  <text x="458" y="142" font-size="12.5" fill="#7f1d1d">9 / 5 = 1.8 no es exacto en binario.</text>
  <text x="20" y="196" font-size="14" font-weight="800" fill="#1e293b">Redondear 100 °F → 37.7777… °C</text>
  <g>
    <rect x="20" y="212" width="266" height="110" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
    <rect x="297" y="212" width="266" height="110" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <rect x="574" y="212" width="266" height="110" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  </g>
  <g font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="800">
    <text x="36" y="240" fill="#78350f">Math.round(x)</text>
    <text x="313" y="240" fill="#14532d">Math.round(x * 100) / 100</text>
    <text x="590" y="240" fill="#0c4a6e">x.toFixed(2)</text>
  </g>
  <g font-family="ui-monospace, Menlo, monospace" font-size="26" font-weight="800">
    <text x="36" y="280" fill="#78350f">38</text>
    <text x="313" y="280" fill="#14532d">37.78</text>
    <text x="590" y="280" fill="#0c4a6e">"37.78"</text>
  </g>
  <g font-size="12.5">
    <text x="36" y="304" fill="#78350f">Pierde los decimales.</text>
    <text x="313" y="304" fill="#14532d">Un número con dos decimales.</text>
    <text x="590" y="304" fill="#0c4a6e">Devuelve un texto, no un número.</text>
  </g>
  <text x="430" y="362" text-anchor="middle" font-size="12.5" fill="#4d290b">Con tipos de coma flotante, un resultado «exacto» en papel puede no serlo: se redondea al final, no en cada paso.</text>
</svg>
