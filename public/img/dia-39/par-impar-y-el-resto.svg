<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="t">Qué da el resto de dividir entre 2</title>
  <desc id="d">Tabla con seis valores y el resultado de n resto 2. El 7 da 1, y es impar. El 8 da 0, y es par. El 0 da 0 y es par. El menos 7 da menos 1, porque el resto toma el signo del dividendo, así que comparar con 1 falla. El menos 8 da menos 0, que es igual a 0 y es par. El 2,5 da 0,5 y no es un entero. NaN da NaN. Comparar con 0 funciona para los enteros, y hay que comprobar que sea un entero.</desc>
  <rect width="860" height="420" fill="#fffdf7"/>
  <text x="430" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#4d290b">n % 2 en JavaScript</text>
  <g font-size="13" font-weight="800" text-anchor="middle">
    <rect x="20" y="50" width="130" height="40" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="85" y="75" fill="#1e293b">n</text>
    <rect x="160" y="50" width="150" height="40" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/><text x="235" y="75" fill="#4c1d95">n % 2</text>
    <rect x="320" y="50" width="190" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="415" y="75" fill="#14532d">n % 2 === 0</text>
    <rect x="520" y="50" width="190" height="40" rx="8" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/><text x="615" y="75" fill="#713f12">n % 2 === 1</text>
    <rect x="720" y="50" width="120" height="40" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/><text x="780" y="75" fill="#0c4a6e">¿entero?</text>
  </g>
  <g fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2">
    <rect x="20" y="98" width="820" height="42" rx="8"/><rect x="20" y="146" width="820" height="42" rx="8"/><rect x="20" y="194" width="820" height="42" rx="8"/>
    <rect x="20" y="242" width="820" height="42" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.8"/><rect x="20" y="290" width="820" height="42" rx="8"/><rect x="20" y="338" width="820" height="42" rx="8"/>
  </g>
  <g font-family="ui-monospace, Menlo, monospace" font-size="15" font-weight="800" text-anchor="middle" fill="#1e293b">
    <text x="85" y="125">7</text><text x="235" y="125">1</text><text x="415" y="125">false</text><text x="615" y="125">true</text><text x="780" y="125">sí</text>
    <text x="85" y="173">8</text><text x="235" y="173">0</text><text x="415" y="173">true</text><text x="615" y="173">false</text><text x="780" y="173">sí</text>
    <text x="85" y="221">0</text><text x="235" y="221">0</text><text x="415" y="221">true</text><text x="615" y="221">false</text><text x="780" y="221">sí</text>
    <text x="85" y="269" fill="#7f1d1d">-7</text><text x="235" y="269" fill="#7f1d1d">-1</text><text x="415" y="269" fill="#7f1d1d">false</text><text x="615" y="269" fill="#7f1d1d">false ← ¡trampa!</text><text x="780" y="269" fill="#7f1d1d">sí</text>
    <text x="85" y="317">-8</text><text x="235" y="317">-0</text><text x="415" y="317">true</text><text x="615" y="317">false</text><text x="780" y="317">sí</text>
    <text x="85" y="365">2.5</text><text x="235" y="365">0.5</text><text x="415" y="365">false</text><text x="615" y="365">false</text><text x="780" y="365" fill="#7f1d1d">no</text>
  </g>
  <text x="430" y="402" text-anchor="middle" font-size="12.5" fill="#4d290b">% es el resto: toma el signo del dividendo. Para los enteros, comparar con 0 sirve; comparar con 1 falla con los negativos impares.</text>
</svg>
