<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="t">Cuándo usar una función flecha y cuándo otra forma</title>
  <desc id="d">A la izquierda, buenas opciones para una flecha: callbacks cortos como forEach, map, filter y setTimeout; funciones de una sola expresión; y callbacks dentro de un método, que toman el this del método. A la derecha, casos donde conviene otra forma: los métodos de un objeto que usan this, donde se usa el método abreviado; los constructores que se usan con new, donde se usa function o class; las funciones que necesitan su propio arguments, donde se usan parámetros rest; y las funciones generadoras, que usan function con asterisco.</desc>
  <rect width="860" height="440" fill="#fffdf7"/>
  <text x="430" y="28" text-anchor="middle" font-size="20" font-weight="700" fill="#4d290b">¿Función flecha o función normal?</text>

  <rect x="20" y="44" width="400" height="330" rx="14" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <rect x="440" y="44" width="400" height="330" rx="14" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
  <text x="220" y="70" text-anchor="middle" font-size="15" font-weight="800" fill="#14532d">Buena opción para una flecha</text>
  <text x="640" y="70" text-anchor="middle" font-size="15" font-weight="800" fill="#7f1d1d">Mejor otra forma</text>

  <!-- Izquierda -->
  <g>
    <rect x="36" y="86" width="368" height="64" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
    <rect x="36" y="162" width="368" height="64" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
    <rect x="36" y="238" width="368" height="64" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="2"/>
  </g>
  <g font-size="13" font-weight="800" fill="#14532d">
    <text x="52" y="110">Callbacks cortos</text>
    <text x="52" y="186">Funciones de una sola expresión</text>
    <text x="52" y="262">Callbacks dentro de un método</text>
  </g>
  <g font-size="12" fill="#3b2410" font-family="ui-monospace, Menlo, monospace">
    <text x="52" y="132">forEach, map, filter, setTimeout</text>
    <text x="52" y="208">const doble = n =&gt; n * 2;</text>
    <text x="52" y="284">toman el this del método</text>
  </g>

  <!-- Derecha -->
  <g>
    <rect x="456" y="86" width="368" height="56" rx="10" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
    <rect x="456" y="152" width="368" height="56" rx="10" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
    <rect x="456" y="218" width="368" height="56" rx="10" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
    <rect x="456" y="284" width="368" height="56" rx="10" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
  </g>
  <g font-size="13" font-weight="800" fill="#7f1d1d">
    <text x="472" y="108">Métodos de un objeto que usan this</text>
    <text x="472" y="174">Constructores (se usan con new)</text>
    <text x="472" y="240">Funciones que necesitan su propio arguments</text>
    <text x="472" y="306">Funciones generadoras (yield)</text>
  </g>
  <g font-size="12" fill="#3b2410" font-family="ui-monospace, Menlo, monospace">
    <text x="472" y="128">usa el método abreviado: ladrar() { }</text>
    <text x="472" y="194">usa function o class</text>
    <text x="472" y="260">usa parámetros rest: (...args)</text>
    <text x="472" y="326">usa function*</text>
  </g>

  <rect x="60" y="388" width="740" height="40" rx="12" fill="#ffedc9" stroke="#b45f06" stroke-width="2"/>
  <text x="430" y="413" text-anchor="middle" font-size="13" font-weight="800" fill="#4d290b">Para callbacks y funciones cortas, la flecha; para métodos y constructores, la forma tradicional.</text>
</svg>
