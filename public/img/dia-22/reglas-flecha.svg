<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="t">Cuándo llevan paréntesis y llaves las funciones flecha</title>
  <desc id="d">Tabla de reglas. Sin parámetros, los paréntesis son obligatorios: () =&gt; ... Con un parámetro, los paréntesis son opcionales: n =&gt; ..., aunque son obligatorios si el parámetro tiene valor por defecto, desestructuración o rest. Con dos o más parámetros, los paréntesis son obligatorios. Si el cuerpo es una sola expresión, se pueden omitir las llaves y el return. Si el cuerpo tiene varias instrucciones, hacen falta llaves y return. Para devolver un objeto literal con retorno implícito, hay que envolverlo entre paréntesis.</desc>
  <rect width="860" height="440" fill="#fffdf7"/>
  <text x="430" y="28" text-anchor="middle" font-size="20" font-weight="700" fill="#4d290b">Reglas de paréntesis, llaves y return</text>

  <g font-size="13" font-weight="800" text-anchor="middle" fill="#4d290b">
    <rect x="20" y="44" width="200" height="36" rx="8" fill="#ffedc9" stroke="#b45f06" stroke-width="2"/><text x="120" y="67">Caso</text>
    <rect x="230" y="44" width="260" height="36" rx="8" fill="#ffedc9" stroke="#b45f06" stroke-width="2"/><text x="360" y="67">Cómo se escribe</text>
    <rect x="500" y="44" width="340" height="36" rx="8" fill="#ffedc9" stroke="#b45f06" stroke-width="2"/><text x="670" y="67">Detalle</text>
  </g>

  <g fill="#ffffff" stroke="#e8c98a" stroke-width="1.5">
    <rect x="20" y="88" width="200" height="52" rx="8"/><rect x="230" y="88" width="260" height="52" rx="8"/><rect x="500" y="88" width="340" height="52" rx="8"/>
    <rect x="20" y="146" width="200" height="52" rx="8"/><rect x="230" y="146" width="260" height="52" rx="8"/><rect x="500" y="146" width="340" height="52" rx="8"/>
    <rect x="20" y="204" width="200" height="52" rx="8"/><rect x="230" y="204" width="260" height="52" rx="8"/><rect x="500" y="204" width="340" height="52" rx="8"/>
    <rect x="20" y="262" width="200" height="52" rx="8"/><rect x="230" y="262" width="260" height="52" rx="8"/><rect x="500" y="262" width="340" height="52" rx="8"/>
    <rect x="20" y="320" width="200" height="52" rx="8"/><rect x="230" y="320" width="260" height="52" rx="8"/><rect x="500" y="320" width="340" height="52" rx="8"/>
    <rect x="20" y="378" width="200" height="52" rx="8"/><rect x="230" y="378" width="260" height="52" rx="8"/><rect x="500" y="378" width="340" height="52" rx="8"/>
  </g>

  <g font-size="13" font-weight="800" fill="#4d290b" text-anchor="middle">
    <text x="120" y="119">Sin parámetros</text>
    <text x="120" y="177">Un parámetro</text>
    <text x="120" y="235">Dos o más parámetros</text>
    <text x="120" y="293">Cuerpo de una expresión</text>
    <text x="120" y="351">Varias instrucciones</text>
    <text x="120" y="409">Devolver un objeto</text>
  </g>
  <g font-family="ui-monospace, Menlo, monospace" font-size="14" font-weight="800" fill="#312e81" text-anchor="middle">
    <text x="360" y="119">() =&gt; "hola"</text>
    <text x="360" y="177">n =&gt; n * 2</text>
    <text x="360" y="235">(a, b) =&gt; a + b</text>
    <text x="360" y="293">x =&gt; x + 1</text>
    <text x="360" y="351">x =&gt; { ...; return y; }</text>
    <text x="360" y="409">() =&gt; ({ a: 1 })</text>
  </g>
  <g font-size="12" fill="#3b2410" text-anchor="middle">
    <text x="670" y="119">Los paréntesis son obligatorios.</text>
    <text x="670" y="164">Los paréntesis son opcionales.</text><text x="670" y="179">Obligatorios con valor por defecto,</text><text x="670" y="193">desestructuración o rest.</text>
    <text x="670" y="235">Los paréntesis son obligatorios.</text>
    <text x="670" y="287">Sin llaves ni return: la expresión es</text><text x="670" y="303">el valor devuelto (retorno implícito).</text>
    <text x="670" y="345">Llaves y return explícito: sin return,</text><text x="670" y="361">la función devuelve undefined.</text>
    <text x="670" y="403">Entre paréntesis; sin ellos, las llaves</text><text x="670" y="419">se leen como un bloque de código.</text>
  </g>
</svg>
