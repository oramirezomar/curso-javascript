<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="t">Formas de escribir un objeto literal</title>
  <desc id="d">Tabla. Propiedad abreviada, con la sintaxis { nombre, edad }, desde ES2015: usa la variable del mismo nombre. Método abreviado, con { ladrar() { } }, desde ES2015: no puede usarse como constructor. Nombre calculado, con { [expresión]: valor }, desde ES2015: el resultado de la expresión es el nombre. Getter y setter, con { get x() { } }, desde ES5: se leen y se escriben como propiedades. Spread, con { ...otro }, desde ES2018: copia las propiedades de otro objeto, y se verá en una lección posterior.</desc>
  <rect width="860" height="430" fill="#fffdf7"/>
  <text x="430" y="28" text-anchor="middle" font-size="20" font-weight="700" fill="#4d290b">Resumen: formas dentro de un objeto literal</text>

  <!-- Encabezado -->
  <g font-size="13" font-weight="800" text-anchor="middle" fill="#4d290b">
    <rect x="20" y="44" width="170" height="36" rx="8" fill="#ffedc9" stroke="#b45f06" stroke-width="2"/><text x="105" y="67">Forma</text>
    <rect x="200" y="44" width="270" height="36" rx="8" fill="#ffedc9" stroke="#b45f06" stroke-width="2"/><text x="335" y="67">Sintaxis</text>
    <rect x="480" y="44" width="90" height="36" rx="8" fill="#ffedc9" stroke="#b45f06" stroke-width="2"/><text x="525" y="67">Desde</text>
    <rect x="580" y="44" width="260" height="36" rx="8" fill="#ffedc9" stroke="#b45f06" stroke-width="2"/><text x="710" y="67">Qué hace</text>
  </g>

  <!-- Celdas -->
  <g fill="#ffffff" stroke="#e8c98a" stroke-width="1.5">
    <rect x="20" y="88" width="170" height="60" rx="8"/><rect x="200" y="88" width="270" height="60" rx="8"/><rect x="480" y="88" width="90" height="60" rx="8"/><rect x="580" y="88" width="260" height="60" rx="8"/>
    <rect x="20" y="156" width="170" height="60" rx="8"/><rect x="200" y="156" width="270" height="60" rx="8"/><rect x="480" y="156" width="90" height="60" rx="8"/><rect x="580" y="156" width="260" height="60" rx="8"/>
    <rect x="20" y="224" width="170" height="60" rx="8"/><rect x="200" y="224" width="270" height="60" rx="8"/><rect x="480" y="224" width="90" height="60" rx="8"/><rect x="580" y="224" width="260" height="60" rx="8"/>
    <rect x="20" y="292" width="170" height="60" rx="8"/><rect x="200" y="292" width="270" height="60" rx="8"/><rect x="480" y="292" width="90" height="60" rx="8"/><rect x="580" y="292" width="260" height="60" rx="8"/>
    <rect x="20" y="360" width="170" height="60" rx="8"/><rect x="200" y="360" width="270" height="60" rx="8"/><rect x="480" y="360" width="90" height="60" rx="8"/><rect x="580" y="360" width="260" height="60" rx="8"/>
  </g>

  <g font-size="13" font-weight="800" fill="#4d290b" text-anchor="middle">
    <text x="105" y="123">Propiedad abreviada</text>
    <text x="105" y="191">Método abreviado</text>
    <text x="105" y="259">Nombre calculado</text>
    <text x="105" y="327">Getter y setter</text>
    <text x="105" y="395">Spread</text>
  </g>
  <g font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="700" fill="#312e81" text-anchor="middle">
    <text x="335" y="123">{ nombre, edad }</text>
    <text x="335" y="191">{ ladrar() { ... } }</text>
    <text x="335" y="259">{ [expresión]: valor }</text>
    <text x="335" y="327">{ get x() { ... } }</text>
    <text x="335" y="395">{ ...otro }</text>
  </g>
  <g font-size="13" font-weight="800" fill="#14532d" text-anchor="middle">
    <text x="525" y="123">ES2015</text>
    <text x="525" y="191">ES2015</text>
    <text x="525" y="259">ES2015</text>
    <text x="525" y="327">ES5</text>
    <text x="525" y="395">ES2018</text>
  </g>
  <g font-size="12" fill="#3b2410" text-anchor="middle">
    <text x="710" y="119">Usa la variable del mismo nombre</text><text x="710" y="137">como nombre y como valor.</text>
    <text x="710" y="187">Sin la palabra function. No se</text><text x="710" y="205">puede usar con new.</text>
    <text x="710" y="255">El resultado de la expresión es</text><text x="710" y="273">el nombre de la propiedad.</text>
    <text x="710" y="323">Se leen y se escriben como una</text><text x="710" y="341">propiedad, pero ejecutan código.</text>
    <text x="710" y="391">Copia las propiedades de otro</text><text x="710" y="409">objeto (lección posterior).</text>
  </g>
</svg>
