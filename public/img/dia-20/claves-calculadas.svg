<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="t">Nombres de propiedad calculados</title>
  <desc id="d">Dentro de un objeto literal, lo que va entre corchetes se evalúa y su resultado se usa como nombre de la propiedad. [clave] crea la propiedad edad porque la variable clave vale edad. ["x" + 1] crea la propiedad x1. Una plantilla de texto con k y 1 + 1 crea la propiedad k2. Sin corchetes, el nombre se toma tal cual.</desc>
  <rect width="860" height="420" fill="#fffdf7"/>
  <text x="430" y="28" text-anchor="middle" font-size="20" font-weight="700" fill="#4d290b">Entre corchetes, el nombre de la propiedad se calcula</text>

  <rect x="20" y="46" width="470" height="274" rx="12" fill="#2b1b0e"/>

  <!-- Bandas -->
  <rect x="28" y="134" width="454" height="30" rx="4" fill="#14532d"/>
  <rect x="28" y="168" width="454" height="30" rx="4" fill="#1e3a8a"/>
  <rect x="28" y="202" width="454" height="30" rx="4" fill="#78350f"/>

  <g font-family="ui-monospace, Menlo, monospace" font-size="14" font-weight="700" fill="#fde7c2">
    <text x="40" y="86">const clave = "edad";</text>
    <text x="40" y="120">const o = {</text>
    <text x="40" y="154">&#160;&#160;[clave]: 7,</text>
    <text x="40" y="188">&#160;&#160;["x" + 1]: "y",</text>
    <text x="40" y="222">&#160;&#160;[`k${1 + 1}`]: true,</text>
    <text x="40" y="256">&#160;&#160;nombre: "Rex",</text>
    <text x="40" y="290">};</text>
  </g>

  <text x="660" y="74" text-anchor="middle" font-size="13" font-weight="800" fill="#4d290b">Propiedad creada</text>

  <!-- Flechas -->
  <g stroke="#783d06" stroke-width="2.5" fill="#783d06">
    <line x1="490" y1="149" x2="552" y2="149"/><polygon points="550,143 560,149 550,155"/>
    <line x1="490" y1="183" x2="552" y2="183"/><polygon points="550,177 560,183 550,189"/>
    <line x1="490" y1="217" x2="552" y2="217"/><polygon points="550,211 560,217 550,223"/>
    <line x1="490" y1="251" x2="552" y2="251" stroke="#9ca3af"/><polygon points="550,245 560,251 550,257" fill="#9ca3af"/>
  </g>

  <g text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="14" font-weight="800">
    <rect x="560" y="134" width="260" height="30" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="690" y="154" fill="#14532d">edad: 7</text>
    <rect x="560" y="168" width="260" height="30" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="690" y="188" fill="#1e3a8a">x1: "y"</text>
    <rect x="560" y="202" width="260" height="30" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="690" y="222" fill="#7c2d12">k2: true</text>
    <rect x="560" y="236" width="260" height="30" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text x="690" y="256" fill="#4b5563">nombre: "Rex"</text>
  </g>
  <text x="690" y="286" text-anchor="middle" font-size="12" fill="#6b7280">sin corchetes: el nombre es literal</text>

  <rect x="60" y="338" width="740" height="64" rx="12" fill="#ffedc9" stroke="#b45f06" stroke-width="2"/>
  <text x="430" y="364" text-anchor="middle" font-size="14" font-weight="800" fill="#4d290b">El resultado de la expresión entre corchetes es el nombre de la propiedad.</text>
  <text x="430" y="386" text-anchor="middle" font-size="13" fill="#4d290b">Sin corchetes, { clave: 7 } crearía una propiedad que se llama literalmente clave.</text>
</svg>
