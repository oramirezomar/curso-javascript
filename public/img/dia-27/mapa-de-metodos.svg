<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 420" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="t">Los métodos del objeto console, por finalidad</title>
  <desc id="d">Cinco grupos de métodos. Mostrar mensajes: log, info, warn, error y debug. Organizar la salida: group, groupCollapsed, groupEnd, table y dir. Medir y contar: time, timeLog, timeEnd, count y countReset. Verificar: assert, que solo escribe un error si la condición es falsa. Limpiar: clear, que borra los mensajes anteriores.</desc>
  <rect width="860" height="420" fill="#fffdf7"/>
  <text x="430" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#4d290b">Los métodos de console, por finalidad</text>
  <rect x="20" y="50" width="260" height="206" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <rect x="300" y="50" width="260" height="206" rx="12" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
  <rect x="580" y="50" width="260" height="206" rx="12" fill="#fef9c3" stroke="#a16207" stroke-width="2"/>
  <rect x="20" y="274" width="400" height="124" rx="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <rect x="440" y="274" width="400" height="124" rx="12" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/>
  <g font-size="15" font-weight="800">
    <text x="36" y="80" fill="#14532d">Mostrar mensajes</text>
    <text x="316" y="80" fill="#312e81">Organizar la salida</text>
    <text x="596" y="80" fill="#713f12">Medir y contar</text>
    <text x="36" y="304" fill="#7f1d1d">Verificar</text>
    <text x="456" y="304" fill="#581c87">Limpiar</text>
  </g>
  <g font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="700">
    <g fill="#14532d"><text x="36" y="112">log()</text><text x="36" y="136">info()</text><text x="36" y="160">warn()</text><text x="36" y="184">error()</text><text x="36" y="208">debug()</text></g>
    <g fill="#312e81"><text x="316" y="112">group()</text><text x="316" y="136">groupCollapsed()</text><text x="316" y="160">groupEnd()</text><text x="316" y="184">table()</text><text x="316" y="208">dir()</text></g>
    <g fill="#713f12"><text x="596" y="112">time()</text><text x="596" y="136">timeLog()</text><text x="596" y="160">timeEnd()</text><text x="596" y="184">count()</text><text x="596" y="208">countReset()</text></g>
    <text x="36" y="338" fill="#7f1d1d">assert(condición, mensaje)</text>
    <text x="456" y="338" fill="#581c87">clear()</text>
  </g>
  <g font-size="13">
    <text x="36" y="366" fill="#7f1d1d">Escribe un error solo si la</text>
    <text x="36" y="384" fill="#7f1d1d">condición es falsa. No detiene el programa.</text>
    <text x="456" y="366" fill="#581c87">Borra los mensajes anteriores</text>
    <text x="456" y="384" fill="#581c87">de la consola, si el entorno lo permite.</text>
  </g>
  <g font-size="12" fill="#3b2410">
    <text x="150" y="240" text-anchor="middle" fill="#14532d">cada uno con su nivel de severidad</text>
    <text x="430" y="240" text-anchor="middle" fill="#312e81">agrupar, tabular, inspeccionar</text>
    <text x="710" y="240" text-anchor="middle" fill="#713f12">cronómetros y contadores</text>
  </g>
</svg>
