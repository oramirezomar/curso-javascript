<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="t">Especificadores de formato de console.log</title>
  <desc id="d">Seis especificadores. Percent s convierte a texto: console.log con Hola percent s y Ana imprime Hola Ana. Percent d y percent i convierten a entero: 35 años. Percent f convierte a decimal: 19.99. Percent o muestra un objeto con el formato más útil. Percent O muestra un objeto con formato genérico. Percent c aplica estilos CSS, y solo tiene efecto en los navegadores. Los valores se toman en orden de los argumentos que siguen al texto.</desc>
  <rect width="860" height="400" fill="#fffdf7"/>
  <text x="430" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#4d290b">Cada % del texto toma el siguiente argumento</text>
  <g font-size="13" font-weight="800" text-anchor="middle" fill="#4d290b">
    <rect x="20" y="46" width="100" height="34" rx="8" fill="#ffedc9" stroke="#b45f06" stroke-width="2"/><text x="70" y="68">Código</text>
    <rect x="126" y="46" width="220" height="34" rx="8" fill="#ffedc9" stroke="#b45f06" stroke-width="2"/><text x="236" y="68">Qué inserta</text>
    <rect x="352" y="46" width="330" height="34" rx="8" fill="#ffedc9" stroke="#b45f06" stroke-width="2"/><text x="517" y="68">Ejemplo</text>
    <rect x="688" y="46" width="152" height="34" rx="8" fill="#ffedc9" stroke="#b45f06" stroke-width="2"/><text x="764" y="68">Resultado</text>
  </g>
  <g stroke-width="1.5" stroke="#e8c98a" fill="#ffffff">
    <rect x="20" y="88" width="100" height="44" rx="8"/><rect x="126" y="88" width="220" height="44" rx="8"/><rect x="352" y="88" width="330" height="44" rx="8"/><rect x="688" y="88" width="152" height="44" rx="8"/>
    <rect x="20" y="138" width="100" height="44" rx="8"/><rect x="126" y="138" width="220" height="44" rx="8"/><rect x="352" y="138" width="330" height="44" rx="8"/><rect x="688" y="138" width="152" height="44" rx="8"/>
    <rect x="20" y="188" width="100" height="44" rx="8"/><rect x="126" y="188" width="220" height="44" rx="8"/><rect x="352" y="188" width="330" height="44" rx="8"/><rect x="688" y="188" width="152" height="44" rx="8"/>
    <rect x="20" y="238" width="100" height="44" rx="8"/><rect x="126" y="238" width="220" height="44" rx="8"/><rect x="352" y="238" width="330" height="44" rx="8"/><rect x="688" y="238" width="152" height="44" rx="8"/>
    <rect x="20" y="288" width="100" height="44" rx="8"/><rect x="126" y="288" width="220" height="44" rx="8"/><rect x="352" y="288" width="330" height="44" rx="8"/><rect x="688" y="288" width="152" height="44" rx="8"/>
    <rect x="20" y="338" width="100" height="44" rx="8"/><rect x="126" y="338" width="220" height="44" rx="8"/><rect x="352" y="338" width="330" height="44" rx="8"/><rect x="688" y="338" width="152" height="44" rx="8"/>
  </g>
  <g font-family="ui-monospace, Menlo, monospace" font-size="14" font-weight="800" fill="#312e81" text-anchor="middle">
    <text x="70" y="116">%s</text><text x="70" y="166">%d / %i</text><text x="70" y="216">%f</text><text x="70" y="266">%o</text><text x="70" y="316">%O</text><text x="70" y="366">%c</text>
  </g>
  <g font-size="13" fill="#3b2410" text-anchor="middle">
    <text x="236" y="115">Convierte a texto</text>
    <text x="236" y="165">Convierte a entero</text>
    <text x="236" y="215">Convierte a decimal</text>
    <text x="236" y="265">Objeto, formato más útil</text>
    <text x="236" y="315">Objeto, formato genérico</text>
    <text x="236" y="365">Aplica estilos CSS</text>
  </g>
  <g font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="700" fill="#14532d" text-anchor="middle">
    <text x="517" y="115">console.log("Hola %s", "Ana")</text>
    <text x="517" y="165">console.log("%d años", 35)</text>
    <text x="517" y="215">console.log("%f €", "19.99")</text>
    <text x="517" y="265">console.log("%o", persona)</text>
    <text x="517" y="315">console.log("%O", persona)</text>
    <text x="517" y="365">console.log("%cHola", "color: red")</text>
  </g>
  <g font-size="12" font-weight="700" fill="#3b2410" text-anchor="middle">
    <text x="764" y="115">Hola Ana</text>
    <text x="764" y="165">35 años</text>
    <text x="764" y="215">19.99 €</text>
    <text x="764" y="261">objeto</text><text x="764" y="277" font-weight="400" font-size="11">desplegable</text>
    <text x="764" y="311">objeto</text><text x="764" y="327" font-weight="400" font-size="11">desplegable</text>
    <text x="764" y="361">Hola en rojo</text><text x="764" y="377" font-weight="400" font-size="11">solo navegador</text>
  </g>
</svg>
