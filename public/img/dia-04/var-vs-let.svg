<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="t">El mismo código con var y con let</title>
  <desc id="d">Con var la variable música vale rock antes del bloque, pop dentro y sigue valiendo pop después, porque es la misma variable. Con let la variable de dentro del bloque es otra distinta y después del bloque vuelve a valer rock.</desc>
  <rect width="860" height="360" fill="#fffdf7"/>
  <text x="430" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#4d290b">var frente a let con un bloque { }</text>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- var -->
  <rect x="20" y="52" width="410" height="290" rx="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="225" y="80" text-anchor="middle" font-size="16" font-weight="800" fill="#7f1d1d">var  (una sola variable)</text>
  <rect x="44" y="96" width="362" height="52" rx="8" fill="#0d1117"/>
  <text x="56" y="118" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#c9d1d9">var musica = "rock";   { var musica = "pop"; }</text>
  <text x="56" y="136" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#8b949e">// dentro del bloque es la misma variable</text>
  <g text-anchor="middle">
    <rect x="44" y="170" width="104" height="70" rx="10" fill="#fff" stroke="#b91c1c" stroke-width="2"/>
    <text x="96" y="192" font-size="12" fill="#7f1d1d">antes</text>
    <text x="96" y="224" font-size="20" font-weight="800" fill="#7f1d1d">rock</text>
    <rect x="164" y="170" width="104" height="70" rx="10" fill="#fff" stroke="#b91c1c" stroke-width="2"/>
    <text x="216" y="192" font-size="12" fill="#7f1d1d">dentro</text>
    <text x="216" y="224" font-size="20" font-weight="800" fill="#7f1d1d">pop</text>
    <rect x="284" y="170" width="104" height="70" rx="10" fill="#fff" stroke="#b91c1c" stroke-width="2"/>
    <text x="336" y="192" font-size="12" fill="#7f1d1d">después</text>
    <text x="336" y="224" font-size="20" font-weight="800" fill="#7f1d1d">pop</text>
  </g>
  <path d="M150 205 L160 205" stroke="#64748b" stroke-width="1.2" fill="none" marker-end="url(#a)"/>
  <path d="M270 205 L280 205" stroke="#64748b" stroke-width="1.2" fill="none" marker-end="url(#a)"/>
  <text x="225" y="276" text-anchor="middle" font-size="13" font-weight="700" fill="#7f1d1d">El valor «se escapa» del bloque</text>
  <text x="225" y="296" text-anchor="middle" font-size="12" fill="#991b1b">En casi cualquier otro lenguaje,</text>
  <text x="225" y="314" text-anchor="middle" font-size="12" fill="#991b1b">tras el bloque volvería a valer rock.</text>

  <!-- let -->
  <rect x="450" y="52" width="390" height="290" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="645" y="80" text-anchor="middle" font-size="16" font-weight="800" fill="#14532d">let  (dos variables distintas)</text>
  <rect x="470" y="96" width="350" height="52" rx="8" fill="#0d1117"/>
  <text x="482" y="118" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#c9d1d9">let musica = "rock";   { let musica = "pop"; }</text>
  <text x="482" y="136" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#8b949e">// la de dentro solo existe dentro del bloque</text>
  <g text-anchor="middle">
    <rect x="470" y="170" width="104" height="70" rx="10" fill="#fff" stroke="#15803d" stroke-width="2"/>
    <text x="522" y="192" font-size="12" fill="#14532d">antes</text>
    <text x="522" y="224" font-size="20" font-weight="800" fill="#14532d">rock</text>
    <rect x="590" y="170" width="104" height="70" rx="10" fill="#fff" stroke="#15803d" stroke-width="2"/>
    <text x="642" y="192" font-size="12" fill="#14532d">dentro</text>
    <text x="642" y="224" font-size="20" font-weight="800" fill="#14532d">pop</text>
    <rect x="710" y="170" width="104" height="70" rx="10" fill="#fff" stroke="#15803d" stroke-width="2"/>
    <text x="762" y="192" font-size="12" fill="#14532d">después</text>
    <text x="762" y="224" font-size="20" font-weight="800" fill="#14532d">rock</text>
  </g>
  <path d="M576 205 L586 205" stroke="#64748b" stroke-width="1.2" fill="none" marker-end="url(#a)"/>
  <path d="M696 205 L706 205" stroke="#64748b" stroke-width="1.2" fill="none" marker-end="url(#a)"/>
  <text x="645" y="276" text-anchor="middle" font-size="13" font-weight="700" fill="#14532d">El bloque tiene su propio ámbito</text>
  <text x="645" y="296" text-anchor="middle" font-size="12" fill="#166534">Es el comportamiento que esperas si</text>
  <text x="645" y="314" text-anchor="middle" font-size="12" fill="#166534">vienes de otro lenguaje.</text>
</svg>
