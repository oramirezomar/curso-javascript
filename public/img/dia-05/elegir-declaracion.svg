<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="t">Cómo elegir entre const, let y var</title>
  <desc id="d">Diagrama de decisión: si vas a reasignar la variable o la declaras vacía para asignarla después, usa let; si no vas a reasignarla, usa const aunque sea un objeto o arreglo que cambie por dentro. var queda solo para mantener código antiguo.</desc>
  <rect width="860" height="380" fill="#fffdf7"/>
  <text x="430" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#4d290b">¿const, let o var?</text>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#b45f06"/>
    </marker>
  </defs>

  <!-- Pregunta -->
  <rect x="270" y="56" width="320" height="76" rx="38" fill="#ffedc9" stroke="#b45f06" stroke-width="2.5"/>
  <text x="430" y="88" text-anchor="middle" font-size="15" font-weight="800" fill="#4d290b">¿Vas a reasignar la variable</text>
  <text x="430" y="110" text-anchor="middle" font-size="15" font-weight="800" fill="#4d290b">más adelante?</text>

  <!-- No -> const -->
  <path d="M300 132 L180 188" stroke="#b45f06" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
  <text x="212" y="150" text-anchor="middle" font-size="14" font-weight="800" fill="#14532d">No</text>
  <rect x="40" y="192" width="270" height="140" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="2.5"/>
  <text x="175" y="224" text-anchor="middle" font-size="22" font-weight="800" fill="#14532d">const</text>
  <text x="175" y="248" text-anchor="middle" font-size="12" fill="#166534">Es la opción por defecto.</text>
  <g font-size="12" fill="#166534" text-anchor="middle">
    <text x="175" y="272">Números, textos, booleanos fijos</text>
    <text x="175" y="290">y también objetos, arreglos y funciones</text>
    <text x="175" y="308">aunque cambie su contenido por dentro.</text>
  </g>

  <!-- Sí -> let -->
  <path d="M560 132 L680 188" stroke="#b45f06" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
  <text x="648" y="150" text-anchor="middle" font-size="14" font-weight="800" fill="#0c4a6e">Sí</text>
  <rect x="550" y="192" width="270" height="140" rx="14" fill="#e0f2fe" stroke="#0369a1" stroke-width="2.5"/>
  <text x="685" y="224" text-anchor="middle" font-size="22" font-weight="800" fill="#0c4a6e">let</text>
  <text x="685" y="248" text-anchor="middle" font-size="12" fill="#075985">Cuando el valor sí se reasigna.</text>
  <g font-size="12" fill="#075985" text-anchor="middle">
    <text x="685" y="272">Contadores y acumuladores</text>
    <text x="685" y="290">Variable declarada vacía</text>
    <text x="685" y="308">que se llena más tarde</text>
  </g>

  <!-- var -->
  <rect x="330" y="214" width="190" height="96" rx="14" fill="#fee2e2" stroke="#b91c1c" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="425" y="244" text-anchor="middle" font-size="18" font-weight="800" fill="#7f1d1d">var</text>
  <text x="425" y="266" text-anchor="middle" font-size="12" fill="#991b1b">Evítala en código nuevo.</text>
  <text x="425" y="284" text-anchor="middle" font-size="12" fill="#991b1b">Solo para mantener</text>
  <text x="425" y="300" text-anchor="middle" font-size="12" fill="#991b1b">código antiguo.</text>

  <text x="430" y="358" text-anchor="middle" font-size="13" fill="#783d06">Si dudas, empieza con const; si más tarde necesitas reasignar, cámbiala a let.</text>
</svg>
