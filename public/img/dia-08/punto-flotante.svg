<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="t">Por qué 0.1 + 0.2 no da 0.3 y qué hacer</title>
  <desc id="d">Los números de JavaScript se guardan en binario, y muchos decimales como 0.1 no tienen una representación binaria exacta, igual que un tercio no se puede escribir exacto en decimal. Por eso 0.1 más 0.2 da 0.30000000000000004. Soluciones: formatear al mostrar con toFixed o Intl.NumberFormat, trabajar con enteros en la unidad mínima, comparar con tolerancia usando Number.EPSILON, o usar una biblioteca decimal.</desc>
  <rect width="860" height="380" fill="#fffdf7"/>
  <text x="430" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#4d290b">Punto flotante: el origen de los «ceros y un uno»</text>

  <rect x="30" y="50" width="800" height="104" rx="12" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text x="430" y="86" text-anchor="middle" font-size="22" font-weight="800" font-family="ui-monospace, Menlo, monospace" fill="#7f1d1d">0.1 + 0.2  →  0.30000000000000004</text>
  <text x="430" y="114" text-anchor="middle" font-size="13" fill="#7f1d1d">0.1 y 0.2 se guardan en binario y no son exactos, igual que 1/3 no se puede escribir exacto como 0.333…</text>
  <text x="430" y="136" text-anchor="middle" font-size="13" fill="#7f1d1d">No es un fallo de JavaScript: lo comparten los lenguajes que usan doubles IEEE 754.</text>

  <text x="430" y="186" text-anchor="middle" font-size="16" font-weight="700" fill="#4d290b">Qué hacer según el caso</text>

  <g font-size="13" fill="#14532d" text-anchor="middle">
    <rect x="30" y="202" width="190" height="130" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="125" y="228" font-size="14" font-weight="800">Mostrar</text>
    <text x="125" y="252" font-family="ui-monospace, Menlo, monospace" font-size="12">toFixed(2)</text>
    <text x="125" y="272" font-family="ui-monospace, Menlo, monospace" font-size="12">Intl.NumberFormat</text>
    <text x="125" y="300">Da formato al texto;</text>
    <text x="125" y="318">no cambia el cálculo.</text>

    <rect x="235" y="202" width="190" height="130" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="330" y="228" font-size="14" font-weight="800">Dinero</text>
    <text x="330" y="252">Guarda enteros en la</text>
    <text x="330" y="270">unidad mínima</text>
    <text x="330" y="288">(centavos) y divide</text>
    <text x="330" y="306">solo al mostrar.</text>

    <rect x="440" y="202" width="190" height="130" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="535" y="228" font-size="14" font-weight="800">Comparar</text>
    <text x="535" y="252" font-family="ui-monospace, Menlo, monospace" font-size="12">Math.abs(a - b) &lt;</text>
    <text x="535" y="270" font-family="ui-monospace, Menlo, monospace" font-size="12">Number.EPSILON</text>
    <text x="535" y="298">Compara con tolerancia,</text>
    <text x="535" y="316">no con ===.</text>

    <rect x="645" y="202" width="185" height="130" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="737" y="228" font-size="14" font-weight="800">Cálculo exacto</text>
    <text x="737" y="252">Biblioteca decimal</text>
    <text x="737" y="270">(decimal.js, big.js…)</text>
    <text x="737" y="298">o BigInt si solo hay</text>
    <text x="737" y="316">enteros enormes.</text>
  </g>

  <text x="430" y="362" text-anchor="middle" font-size="12" fill="#5f3109">Una propuesta de TC39 (Decimal) busca resolverlo en el lenguaje, pero todavía no forma parte del estándar.</text>
</svg>
