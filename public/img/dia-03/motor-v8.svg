<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="t">Cómo ejecuta JavaScript un motor moderno</title>
  <desc id="d">El código fuente se analiza y se convierte en bytecode que el intérprete Ignition ejecuta. El código que se ejecuta mucho se compila a código máquina optimizado con compiladores JIT como Sparkplug, Maglev y TurboFan. Un recolector de basura libera la memoria sin que el programador lo gestione.</desc>
  <rect width="860" height="330" fill="#fffdf7"/>
  <text x="430" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#4d290b">Del texto a la ejecución: el motor compila mientras ejecuta (V8)</text>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#b45f06"/>
    </marker>
  </defs>

  <g text-anchor="middle">
    <rect x="20" y="62" width="150" height="84" rx="12" fill="#ffedc9" stroke="#b45f06" stroke-width="2"/>
    <text x="95" y="96" font-size="14" font-weight="700" fill="#4d290b">Tu código</text>
    <text x="95" y="118" font-size="12" fill="#5f3109">texto .js</text>

    <rect x="212" y="62" width="150" height="84" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
    <text x="287" y="96" font-size="14" font-weight="700" fill="#0c4a6e">Parser</text>
    <text x="287" y="118" font-size="12" fill="#075985">analiza la sintaxis</text>

    <rect x="404" y="62" width="200" height="84" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
    <text x="504" y="92" font-size="14" font-weight="700" fill="#0c4a6e">Ignition</text>
    <text x="504" y="112" font-size="12" fill="#075985">genera bytecode</text>
    <text x="504" y="130" font-size="12" fill="#075985">y lo ejecuta (intérprete)</text>

    <rect x="646" y="62" width="200" height="84" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="746" y="92" font-size="14" font-weight="700" fill="#14532d">Ejecución</text>
    <text x="746" y="112" font-size="12" fill="#166534">el programa corre</text>
    <text x="746" y="130" font-size="12" fill="#166534">sin compilar antes</text>
  </g>
  <path d="M172 104 L208 104" stroke="#b45f06" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <path d="M364 104 L400 104" stroke="#b45f06" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <path d="M606 104 L642 104" stroke="#b45f06" stroke-width="2.5" fill="none" marker-end="url(#a)"/>

  <!-- Código caliente -> JIT -->
  <path d="M504 148 L504 186" stroke="#b45f06" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <text x="516" y="172" font-size="12" font-weight="700" fill="#783d06">código «caliente»</text>
  <text x="516" y="186" font-size="11" fill="#783d06">(se ejecuta muchas veces)</text>

  <g text-anchor="middle">
    <rect x="344" y="196" width="320" height="76" rx="12" fill="#fef9c3" stroke="#a16207" stroke-width="2"/>
    <text x="504" y="224" font-size="14" font-weight="700" fill="#713f12">Compiladores JIT</text>
    <text x="504" y="244" font-size="12" fill="#854d0e">Sparkplug · Maglev · TurboFan</text>
    <text x="504" y="262" font-size="12" fill="#854d0e">→ código máquina optimizado</text>
  </g>
  <path d="M664 234 L746 234 L746 150" stroke="#a16207" stroke-width="2.5" fill="none" marker-end="url(#a)"/>

  <!-- Recolector de basura -->
  <rect x="20" y="196" width="280" height="76" rx="12" fill="#fff" stroke="#e2c28a" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="160" y="224" text-anchor="middle" font-size="14" font-weight="700" fill="#4d290b">Recolector de basura</text>
  <text x="160" y="244" text-anchor="middle" font-size="12" fill="#5f3109">libera la memoria que ya no usas:</text>
  <text x="160" y="262" text-anchor="middle" font-size="12" fill="#5f3109">no la gestionas tú (lenguaje de alto nivel)</text>

  <text x="430" y="304" text-anchor="middle" font-size="12" fill="#783d06">V8 (Chrome, Edge, Node.js). SpiderMonkey (Firefox) y JavaScriptCore (Safari) siguen ideas parecidas.</text>
</svg>
