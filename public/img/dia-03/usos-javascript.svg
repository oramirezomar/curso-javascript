<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="t">Dónde se usa JavaScript</title>
  <desc id="d">JavaScript en el centro y ocho áreas de uso: web en el navegador, servidor con Node.js, bases de datos documentales, aplicaciones móviles e híbridas, videojuegos y gráficos 3D, realidad virtual y aumentada, hardware y robótica, y aprendizaje automático.</desc>
  <rect width="860" height="440" fill="#fffdf7"/>
  <text x="430" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#4d290b">JavaScript va mucho más allá de la web</text>

  <!-- Centro -->
  <rect x="300" y="190" width="260" height="60" rx="30" fill="#f7df1e" stroke="#b45f06" stroke-width="3"/>
  <text x="430" y="228" text-anchor="middle" font-size="24" font-weight="800" fill="#1f1f1f">JavaScript</text>

  <!-- Fila superior -->
  <g text-anchor="middle">
    <rect x="30" y="56" width="190" height="96" rx="12" fill="#ffedc9" stroke="#b45f06" stroke-width="2"/>
    <text x="125" y="86" font-size="15" font-weight="700" fill="#4d290b">Web</text>
    <text x="125" y="108" font-size="12" fill="#5f3109">interfaces en el navegador</text>
    <text x="125" y="126" font-size="12" fill="#5f3109">DOM · formularios · SPA</text>

    <rect x="240" y="56" width="190" height="96" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
    <text x="335" y="86" font-size="15" font-weight="700" fill="#0c4a6e">Servidor</text>
    <text x="335" y="108" font-size="12" fill="#075985">Node.js</text>
    <text x="335" y="126" font-size="12" fill="#075985">APIs y servicios</text>

    <rect x="450" y="56" width="190" height="96" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
    <text x="545" y="86" font-size="15" font-weight="700" fill="#0c4a6e">Datos</text>
    <text x="545" y="108" font-size="12" fill="#075985">bases documentales</text>
    <text x="545" y="126" font-size="12" fill="#075985">MongoDB · Firestore</text>

    <rect x="660" y="56" width="170" height="96" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="745" y="86" font-size="15" font-weight="700" fill="#14532d">Móvil</text>
    <text x="745" y="108" font-size="12" fill="#166534">apps híbridas</text>
    <text x="745" y="126" font-size="12" fill="#166534">Ionic · React Native</text>
  </g>

  <!-- Fila inferior -->
  <g text-anchor="middle">
    <rect x="30" y="288" width="190" height="96" rx="12" fill="#fce7f3" stroke="#be185d" stroke-width="2"/>
    <text x="125" y="318" font-size="15" font-weight="700" fill="#831843">Juegos y 3D</text>
    <text x="125" y="340" font-size="12" fill="#9d174d">WebGL · WebGPU</text>
    <text x="125" y="358" font-size="12" fill="#9d174d">Three.js · Babylon.js</text>

    <rect x="240" y="288" width="190" height="96" rx="12" fill="#fce7f3" stroke="#be185d" stroke-width="2"/>
    <text x="335" y="314" font-size="15" font-weight="700" fill="#831843">Realidad virtual</text>
    <text x="335" y="332" font-size="15" font-weight="700" fill="#831843">y aumentada</text>
    <text x="335" y="352" font-size="12" fill="#9d174d">WebXR (soporte desigual)</text>

    <rect x="450" y="288" width="190" height="96" rx="12" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
    <text x="545" y="318" font-size="15" font-weight="700" fill="#4c1d95">Hardware</text>
    <text x="545" y="340" font-size="12" fill="#5b21b6">Arduino · robots · drones</text>
    <text x="545" y="358" font-size="12" fill="#5b21b6">Johnny-Five</text>

    <rect x="660" y="288" width="170" height="96" rx="12" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
    <text x="745" y="318" font-size="15" font-weight="700" fill="#4c1d95">Aprendizaje</text>
    <text x="745" y="336" font-size="15" font-weight="700" fill="#4c1d95">automático</text>
    <text x="745" y="358" font-size="12" fill="#5b21b6">TensorFlow.js</text>
  </g>

  <!-- Conectores -->
  <g stroke="#b45f06" stroke-width="2" fill="none">
    <path d="M125 152 L125 170 L430 170 L430 190"/>
    <path d="M335 152 L335 190"/>
    <path d="M545 152 L545 190"/>
    <path d="M745 152 L745 170 L430 170"/>
    <path d="M125 288 L125 270 L430 270 L430 250"/>
    <path d="M335 288 L335 250"/>
    <path d="M545 288 L545 250"/>
    <path d="M745 288 L745 270 L430 270"/>
  </g>
  <text x="430" y="418" text-anchor="middle" font-size="12" fill="#783d06">Los nombres de librerías son ejemplos: su vigencia cambia, comprueba siempre el estado del proyecto.</text>
</svg>
