<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="t">Los cuadros bloquean la página y a veces no se muestran</title>
  <desc id="d">Cuatro pasos. Uno: el código se ejecuta. Dos: llega una llamada a alert, confirm o prompt. Tres: el navegador muestra el cuadro y todo se detiene hasta que el usuario responde. Cuatro: el usuario responde y el código continúa con el valor devuelto. Cuando el navegador no puede mostrar los cuadros, por ejemplo en un marco aislado sin permiso para cuadros modales, o si el usuario los bloquea, alert no hace nada, confirm devuelve false y prompt devuelve null.</desc>
  <rect width="860" height="430" fill="#fffdf7"/>
  <text x="430" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#4d290b">Son modales: detienen todo hasta que se responde</text>
  <g stroke-width="2" text-anchor="middle">
    <rect x="20" y="50" width="190" height="104" rx="12" fill="#dcfce7" stroke="#15803d"/>
    <text x="115" y="76" font-size="13" font-weight="800" fill="#14532d">1 · El código corre</text>
    <text x="115" y="104" font-size="12" fill="#14532d">Línea tras línea,</text><text x="115" y="122" font-size="12" fill="#14532d">como siempre</text>
    <rect x="230" y="50" width="190" height="104" rx="12" fill="#e0e7ff" stroke="#4338ca"/>
    <text x="325" y="76" font-size="13" font-weight="800" fill="#312e81">2 · Llega la llamada</text>
    <text x="325" y="108" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="800" fill="#312e81">confirm("¿Seguro?")</text>
    <rect x="440" y="50" width="190" height="104" rx="12" fill="#fee2e2" stroke="#b91c1c"/>
    <text x="535" y="76" font-size="13" font-weight="800" fill="#7f1d1d">3 · Todo se detiene</text>
    <text x="535" y="104" font-size="12" fill="#7f1d1d">El cuadro bloquea la</text><text x="535" y="122" font-size="12" fill="#7f1d1d">página hasta la respuesta</text>
    <rect x="650" y="50" width="190" height="104" rx="12" fill="#fef9c3" stroke="#a16207"/>
    <text x="745" y="76" font-size="13" font-weight="800" fill="#713f12">4 · Se retoma</text>
    <text x="745" y="104" font-size="12" fill="#713f12">El código sigue con el</text><text x="745" y="122" font-size="12" fill="#713f12">valor devuelto</text>
  </g>
  <g stroke="#783d06" stroke-width="2.5" fill="#783d06">
    <line x1="212" y1="102" x2="222" y2="102"/><polygon points="220,96 230,102 220,108"/>
    <line x1="422" y1="102" x2="432" y2="102"/><polygon points="430,96 440,102 430,108"/>
    <line x1="632" y1="102" x2="642" y2="102"/><polygon points="640,96 650,102 640,108"/>
  </g>
  <text x="430" y="188" text-anchor="middle" font-size="14" font-weight="800" fill="#4d290b">Si el navegador no puede mostrar el cuadro, no espera a nadie y devuelve esto</text>
  <g font-size="13" font-weight="800" text-anchor="middle" fill="#4d290b">
    <rect x="20" y="204" width="400" height="36" rx="8" fill="#ffedc9" stroke="#b45f06" stroke-width="2"/><text x="220" y="227">Situación</text>
    <rect x="430" y="204" width="130" height="36" rx="8" fill="#ffedc9" stroke="#b45f06" stroke-width="2"/><text x="495" y="227">alert</text>
    <rect x="570" y="204" width="130" height="36" rx="8" fill="#ffedc9" stroke="#b45f06" stroke-width="2"/><text x="635" y="227">confirm</text>
    <rect x="710" y="204" width="130" height="36" rx="8" fill="#ffedc9" stroke="#b45f06" stroke-width="2"/><text x="775" y="227">prompt</text>
  </g>
  <g stroke-width="1.5">
    <rect x="20" y="248" width="400" height="48" rx="8" fill="#ffffff" stroke="#e8c98a"/><rect x="430" y="248" width="130" height="48" rx="8" fill="#f3f4f6" stroke="#9ca3af"/><rect x="570" y="248" width="130" height="48" rx="8" fill="#e0e7ff" stroke="#4338ca"/><rect x="710" y="248" width="130" height="48" rx="8" fill="#dcfce7" stroke="#15803d"/>
    <rect x="20" y="304" width="400" height="48" rx="8" fill="#ffffff" stroke="#e8c98a"/><rect x="430" y="304" width="130" height="48" rx="8" fill="#f3f4f6" stroke="#9ca3af"/><rect x="570" y="304" width="130" height="48" rx="8" fill="#e0e7ff" stroke="#4338ca"/><rect x="710" y="304" width="130" height="48" rx="8" fill="#dcfce7" stroke="#15803d"/>
  </g>
  <g font-size="12" fill="#3b2410">
    <text x="32" y="270">Marco aislado (iframe) sin permiso para</text><text x="32" y="286">cuadros modales, como el editor de esta página</text>
    <text x="32" y="326">El usuario o el navegador bloquean los</text><text x="32" y="342">cuadros de la página</text>
  </g>
  <g font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="800" text-anchor="middle">
    <g fill="#374151"><text x="495" y="278">undefined</text><text x="495" y="334">undefined</text></g>
    <g fill="#312e81"><text x="635" y="278">false</text><text x="635" y="334">false</text></g>
    <g fill="#14532d"><text x="775" y="278">null</text><text x="775" y="334">null</text></g>
  </g>
  <rect x="20" y="368" width="820" height="46" rx="12" fill="#ffedc9" stroke="#b45f06" stroke-width="2"/>
  <text x="430" y="396" text-anchor="middle" font-size="13" font-weight="800" fill="#4d290b">Tu código debe contar con que confirm dé false y prompt dé null, y comportarse bien en ese caso.</text>
</svg>
