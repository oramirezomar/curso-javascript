<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="t">Cómo localStorage guarda tu progreso en el navegador</title>
  <desc id="d">La página usa setItem para guardar un par clave y valor de texto en el almacenamiento del navegador; al recargar, getItem lo recupera. Los datos se quedan en ese navegador y dispositivo, no viajan a un servidor ni a una cuenta.</desc>
  <rect width="860" height="330" fill="#fffdf7"/>
  <text x="430" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#4d290b">localStorage: guardar y recuperar datos en tu navegador</text>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#b45f06"/>
    </marker>
  </defs>

  <!-- Página -->
  <rect x="30" y="66" width="230" height="130" rx="12" fill="#ffedc9" stroke="#b45f06" stroke-width="2"/>
  <text x="145" y="94" text-anchor="middle" font-size="15" font-weight="700" fill="#4d290b">Tu página (JavaScript)</text>
  <text x="145" y="124" text-anchor="middle" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#5f3109">localStorage.setItem(</text>
  <text x="145" y="142" text-anchor="middle" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#5f3109">  "avance", "[1,2,3]")</text>
  <text x="145" y="176" text-anchor="middle" font-size="12" fill="#783d06">y al volver: getItem("avance")</text>

  <!-- Flechas -->
  <path d="M262 108 L336 108" stroke="#b45f06" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <text x="299" y="98" text-anchor="middle" font-size="12" font-weight="700" fill="#783d06">guardar</text>
  <path d="M336 156 L262 156" stroke="#0369a1" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <text x="299" y="178" text-anchor="middle" font-size="12" font-weight="700" fill="#075985">leer</text>

  <!-- Almacenamiento -->
  <rect x="340" y="66" width="270" height="130" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <text x="475" y="94" text-anchor="middle" font-size="15" font-weight="700" fill="#0c4a6e">Almacenamiento del navegador</text>
  <rect x="360" y="108" width="230" height="30" rx="6" fill="#fff" stroke="#0369a1"/>
  <text x="372" y="128" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#0c4a6e">avance  →  "[1,2,3]"</text>
  <rect x="360" y="146" width="230" height="30" rx="6" fill="#fff" stroke="#0369a1"/>
  <text x="372" y="166" font-size="12" font-family="ui-monospace, Menlo, monospace" fill="#0c4a6e">tema    →  "oscuro"</text>
  <text x="475" y="190" text-anchor="middle" font-size="11" fill="#075985">pares clave/valor · solo texto</text>

  <!-- Servidor tachado -->
  <rect x="660" y="66" width="170" height="130" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="745" y="94" text-anchor="middle" font-size="15" font-weight="700" fill="#475569">Servidor / cuenta</text>
  <text x="745" y="124" text-anchor="middle" font-size="12" fill="#475569">no interviene</text>
  <text x="745" y="144" text-anchor="middle" font-size="12" fill="#475569">no se envía nada</text>
  <text x="745" y="170" text-anchor="middle" font-size="22" font-weight="800" fill="#b91c1c">✕</text>
  <path d="M612 131 L656 131" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="5 4" fill="none"/>

  <!-- Reglas -->
  <rect x="30" y="226" width="800" height="78" rx="12" fill="#fff" stroke="#e2c28a" stroke-width="2"/>
  <g font-size="13" fill="#5f3109">
    <text x="50" y="252">• Sobrevive al cerrar y reabrir el navegador.</text>
    <text x="50" y="274">• Cada origen tiene su espacio propio: unos 5 MiB.</text>
    <text x="50" y="296">• Es local: otro navegador u otro dispositivo no ve esos datos.</text>
    <text x="480" y="252">• Solo guarda texto: usa JSON.stringify y JSON.parse.</text>
    <text x="480" y="274">• Se borra al limpiar los datos del sitio.</text>
    <text x="480" y="296">• En ventanas privadas suele borrarse al cerrarlas.</text>
  </g>
</svg>
