<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="t">jQuery y el problema cross-browser</title>
  <desc id="d">Tu código llama a jQuery; jQuery detecta el navegador y usa ActiveXObject en Internet Explorer 6 y anteriores, o XMLHttpRequest en los demás navegadores.</desc>
  <rect width="800" height="360" fill="#fffdf7"/>
  <text x="400" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#4d290b">jQuery: una librería «cross-browser»</text>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#b45f06"/>
    </marker>
  </defs>

  <rect x="30" y="140" width="190" height="80" rx="12" fill="#fff" stroke="#b45f06" stroke-width="2"/>
  <text x="125" y="172" text-anchor="middle" font-size="14" font-weight="700" fill="#4d290b">Tu código</text>
  <text x="125" y="196" text-anchor="middle" font-size="15" font-family="ui-monospace, Menlo, monospace" fill="#5f3109">$.ajax(…)</text>

  <path d="M222 180 L290 180" stroke="#b45f06" stroke-width="2.5" fill="none" marker-end="url(#a)"/>

  <rect x="294" y="120" width="210" height="120" rx="12" fill="#0769ad" stroke="#044a7a" stroke-width="2"/>
  <text x="399" y="160" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">jQuery</text>
  <text x="399" y="188" text-anchor="middle" font-size="13" fill="#e0f2fe">detecta el navegador</text>
  <text x="399" y="208" text-anchor="middle" font-size="13" fill="#e0f2fe">«tras bambalinas»</text>

  <path d="M506 150 L570 90" stroke="#b45f06" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <path d="M506 210 L570 270" stroke="#b45f06" stroke-width="2.5" fill="none" marker-end="url(#a)"/>

  <rect x="574" y="52" width="200" height="78" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <text x="674" y="82" text-anchor="middle" font-size="14" font-weight="700" fill="#0c4a6e">IE 6 y anteriores</text>
  <text x="674" y="106" text-anchor="middle" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#075985">ActiveXObject</text>

  <rect x="574" y="230" width="200" height="78" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="674" y="260" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">Otros navegadores</text>
  <text x="674" y="284" text-anchor="middle" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#166534">XMLHttpRequest</text>

  <text x="125" y="300" text-anchor="middle" font-size="13" fill="#5f3109">Escribes el código una sola vez</text>
  <text x="125" y="318" text-anchor="middle" font-size="13" fill="#5f3109">y funciona en todos.</text>
</svg>
