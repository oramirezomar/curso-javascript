<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="t">ECMAScript como estándar vivo</title>
  <desc id="d">Desde 2015 hay una edición de ECMAScript cada año, aprobada en junio: ES2015 (ES6), ES2016 (ES7) y así hasta ES2026, la 17.ª edición, aprobada el 30 de junio de 2026. ESNext designa lo que llegará en la siguiente.</desc>
  <rect width="860" height="260" fill="#fffdf7"/>
  <text x="430" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#4d290b">Un estándar vivo: una edición por año (cada junio)</text>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#b45f06"/>
    </marker>
  </defs>

  <g text-anchor="middle">
    <rect x="30" y="66" width="150" height="86" rx="12" fill="#f7df1e" stroke="#b45f06" stroke-width="2"/>
    <text x="105" y="98" font-size="18" font-weight="800" fill="#1f1f1f">ES2015</text>
    <text x="105" y="122" font-size="14" fill="#1f1f1f">= ES6</text>
    <text x="105" y="142" font-size="12" fill="#3f3f3f">6.ª edición</text>

    <path d="M182 109 L214 109" stroke="#b45f06" stroke-width="2.5" fill="none" marker-end="url(#a)"/>

    <rect x="218" y="66" width="150" height="86" rx="12" fill="#ffedc9" stroke="#b45f06" stroke-width="2"/>
    <text x="293" y="98" font-size="18" font-weight="800" fill="#4d290b">ES2016</text>
    <text x="293" y="122" font-size="14" fill="#4d290b">= ES7</text>
    <text x="293" y="142" font-size="12" fill="#783d06">7.ª edición</text>

    <path d="M370 109 L402 109" stroke="#b45f06" stroke-width="2.5" fill="none" marker-end="url(#a)"/>

    <rect x="406" y="66" width="110" height="86" rx="12" fill="#ffedc9" stroke="#b45f06" stroke-width="2"/>
    <text x="461" y="106" font-size="22" font-weight="800" fill="#4d290b">…</text>
    <text x="461" y="132" font-size="12" fill="#783d06">una por año</text>

    <path d="M518 109 L550 109" stroke="#b45f06" stroke-width="2.5" fill="none" marker-end="url(#a)"/>

    <rect x="554" y="66" width="120" height="86" rx="12" fill="#ffedc9" stroke="#b45f06" stroke-width="2"/>
    <text x="614" y="98" font-size="17" font-weight="800" fill="#4d290b">ES2026</text>
    <text x="614" y="122" font-size="13" fill="#4d290b">17.ª edición</text>
    <text x="614" y="142" font-size="11" fill="#783d06">30 jun 2026</text>

    <path d="M676 109 L708 109" stroke="#b45f06" stroke-width="2.5" fill="none" marker-end="url(#a)"/>

    <rect x="712" y="66" width="120" height="86" rx="12" fill="#fff" stroke="#b45f06" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="772" y="98" font-size="17" font-weight="800" fill="#4d290b">ESNext</text>
    <text x="772" y="122" font-size="12" fill="#5f3109">lo que viene</text>
    <text x="772" y="140" font-size="12" fill="#5f3109">después</text>
  </g>

  <rect x="140" y="182" width="580" height="52" rx="12" fill="#ecfccb" stroke="#4d7c0f" stroke-width="2"/>
  <text x="430" y="205" text-anchor="middle" font-size="14" font-weight="700" fill="#365314">Este curso incorpora desde el día 1 las características que llegaron desde 2015.</text>
  <text x="430" y="224" text-anchor="middle" font-size="13" fill="#3f6212">let/const en lugar de var · arrow functions en lugar de funciones anónimas</text>
</svg>
