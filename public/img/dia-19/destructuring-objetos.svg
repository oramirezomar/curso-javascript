<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="t">Desestructurar un objeto: se empareja por nombre</title>
  <desc id="d">El objeto persona tiene las propiedades nombre, apellido y edad. El patrón const { edad, nombre, apellido: ap, pais = "desconocido" } = persona busca cada propiedad por su nombre, sin importar el orden: edad vale 35, nombre vale Ana, ap es un alias de apellido y vale Pérez, y pais no existe en el objeto, así que usa su valor por defecto, desconocido.</desc>
  <rect width="860" height="440" fill="#fffdf7"/>
  <text x="430" y="28" text-anchor="middle" font-size="20" font-weight="700" fill="#4d290b">En un objeto, cada variable busca la propiedad con su nombre</text>

  <rect x="90" y="44" width="680" height="40" rx="10" fill="#2b1b0e"/>
  <text x="430" y="70" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="14" font-weight="700" fill="#fde7c2">const { edad, nombre, apellido: ap, pais = "desconocido" } = persona;</text>

  <g text-anchor="middle" font-size="13" font-weight="800" fill="#4d290b">
    <text x="160" y="116">Propiedades de persona</text>
    <text x="690" y="116">Variables creadas</text>
  </g>

  <!-- Flechas (antes de las cajas) -->
  <g stroke-width="2.5" fill="none">
    <line x1="284" y1="168" x2="556" y2="228" stroke="#1d4ed8"/>
    <line x1="284" y1="228" x2="556" y2="288" stroke="#7e22ce"/>
    <line x1="284" y1="288" x2="556" y2="168" stroke="#15803d"/>
  </g>
  <g>
    <polygon points="548,222 558,229 546,234" fill="#1d4ed8"/>
    <polygon points="548,282 558,289 546,294" fill="#7e22ce"/>
    <polygon points="546,162 558,168 548,176" fill="#15803d"/>
  </g>

  <!-- Propiedades -->
  <g text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="14" font-weight="700">
    <rect x="40" y="146" width="244" height="44" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/><text x="162" y="174" fill="#312e81">nombre: "Ana"</text>
    <rect x="40" y="206" width="244" height="44" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/><text x="162" y="234" fill="#312e81">apellido: "Pérez"</text>
    <rect x="40" y="266" width="244" height="44" rx="10" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/><text x="162" y="294" fill="#312e81">edad: 35</text>
  </g>

  <!-- Variables -->
  <g text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="14" font-weight="700">
    <rect x="556" y="146" width="264" height="44" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="688" y="174" fill="#14532d">edad = 35</text>
    <rect x="556" y="206" width="264" height="44" rx="10" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="688" y="234" fill="#1e3a8a">nombre = "Ana"</text>
    <rect x="556" y="266" width="264" height="44" rx="10" fill="#f3e8ff" stroke="#7e22ce" stroke-width="2"/><text x="688" y="294" fill="#581c87">ap = "Pérez"</text>
    <rect x="556" y="326" width="264" height="44" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2" stroke-dasharray="6 4"/><text x="688" y="354" fill="#713f12">pais = "desconocido"</text>
  </g>

  <g font-size="12" fill="#4d290b">
    <text x="40" y="338" font-weight="800">Sin propiedad pais en el objeto:</text>
    <text x="40" y="356">usa el valor por defecto.</text>
    <text x="40" y="378" font-weight="800" fill="#581c87">apellido: ap</text>
    <text x="118" y="378">renombra la variable (alias).</text>
  </g>

  <rect x="90" y="394" width="680" height="34" rx="10" fill="#ffedc9" stroke="#b45f06" stroke-width="2"/>
  <text x="430" y="416" text-anchor="middle" font-size="13" font-weight="700" fill="#4d290b">El orden no importa. Si el nombre no existe y no hay valor por defecto, la variable vale undefined.</text>
</svg>
