<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="t">Un objeto es una colección de pares clave y valor</title>
  <desc id="d">Un objeto llamado persona con propiedades de distintos tipos: nombre es un texto, edad un número, pasatiempos un arreglo, soltero un booleano, contacto otro objeto y saludar una función, que se llama método. A la derecha, una regla de CSS con propiedad y valor como comparación.</desc>
  <rect width="860" height="440" fill="#fffdf7"/>
  <text x="430" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#4d290b">Un objeto: pares clave y valor</text>

  <!-- Objeto -->
  <rect x="30" y="52" width="520" height="364" rx="14" fill="#0f172a"/>
  <g font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#e2e8f0">
    <text x="50" y="84"><tspan fill="#f9a8d4">const</tspan> persona = {</text>
    <text x="50" y="116">&#160;&#160;<tspan fill="#93c5fd">nombre</tspan>: <tspan fill="#fca5a5">"Ana"</tspan>,</text>
    <text x="50" y="146">&#160;&#160;<tspan fill="#93c5fd">edad</tspan>: <tspan fill="#86efac">35</tspan>,</text>
    <text x="50" y="176">&#160;&#160;<tspan fill="#93c5fd">pasatiempos</tspan>: [<tspan fill="#fca5a5">"correr"</tspan>, <tspan fill="#fca5a5">"leer"</tspan>],</text>
    <text x="50" y="206">&#160;&#160;<tspan fill="#93c5fd">soltero</tspan>: <tspan fill="#fde68a">false</tspan>,</text>
    <text x="50" y="236">&#160;&#160;<tspan fill="#93c5fd">contacto</tspan>: {</text>
    <text x="50" y="262">&#160;&#160;&#160;&#160;<tspan fill="#93c5fd">twitter</tspan>: <tspan fill="#fca5a5">"@ana"</tspan>,</text>
    <text x="50" y="288">&#160;&#160;},</text>
    <text x="50" y="318">&#160;&#160;<tspan fill="#93c5fd">saludar</tspan>: <tspan fill="#f9a8d4">function</tspan> () {</text>
    <text x="50" y="344">&#160;&#160;&#160;&#160;<tspan fill="#f9a8d4">return</tspan> <tspan fill="#fca5a5">"Hola"</tspan>;</text>
    <text x="50" y="368">&#160;&#160;},</text>
    <text x="50" y="392" fill="#e2e8f0">};</text>
  </g>

  <!-- Etiquetas de tipo -->
  <g font-size="12" font-weight="700">
    <text x="420" y="116" fill="#86efac">texto</text>
    <text x="420" y="146" fill="#86efac">número</text>
    <text x="420" y="176" fill="#86efac">arreglo</text>
    <text x="420" y="206" fill="#86efac">booleano</text>
    <text x="420" y="236" fill="#86efac">otro objeto</text>
    <text x="420" y="318" fill="#fde68a">función = método</text>
  </g>

  <!-- Leyenda derecha -->
  <rect x="580" y="52" width="250" height="150" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text x="705" y="80" text-anchor="middle" font-size="14" font-weight="800" fill="#14532d">Propiedad = clave: valor</text>
  <text x="705" y="108" text-anchor="middle" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#14532d">nombre: "Ana"</text>
  <text x="705" y="134" text-anchor="middle" font-size="12" fill="#14532d">La clave (nombre) identifica;</text>
  <text x="705" y="152" text-anchor="middle" font-size="12" fill="#14532d">el valor puede ser de cualquier tipo.</text>
  <text x="705" y="182" text-anchor="middle" font-size="12" fill="#14532d">Se separan con comas.</text>

  <rect x="580" y="216" width="250" height="84" rx="14" fill="#ffedc9" stroke="#b45f06" stroke-width="2"/>
  <text x="705" y="242" text-anchor="middle" font-size="14" font-weight="800" fill="#4d290b">Método</text>
  <text x="705" y="266" text-anchor="middle" font-size="12" fill="#4d290b">Una propiedad cuyo valor es</text>
  <text x="705" y="284" text-anchor="middle" font-size="12" fill="#4d290b">una función.</text>

  <rect x="580" y="314" width="250" height="78" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="705" y="338" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">Parecido a una regla de CSS</text>
  <text x="705" y="362" text-anchor="middle" font-size="13" font-family="ui-monospace, Menlo, monospace" fill="#334155">font-size: 16px;</text>
  <text x="705" y="382" text-anchor="middle" font-size="11" fill="#334155">propiedad: valor</text>
</svg>
